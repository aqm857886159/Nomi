name: SEO Radar

# 每周测一次公开站点，把结构化数据、元数据、sitemap 与可选性能信号存成时间序列。
# 这条流水线只提交 docs/seo 报告；产品代码的自动优化由 Codex heartbeat 通过 PR 完成。
on:
  schedule:
    - cron: '31 1 * * 1' # 每周一 01:31 UTC，错峰运行
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-radar
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Record public SEO snapshot
        id: audit
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: pnpm seo:audit -- --base-url https://nomiaqm.com --out-dir docs/seo/data --reports-dir docs/seo/reports

      - name: Open report-only pull request if changed
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/seo-radar
          delete-branch: false
          commit-message: "chore(seo): weekly public-site observatory snapshot"
          title: "chore(seo): weekly public-site observatory snapshot"
          body: |
            Automated public-site SEO measurement only.

            This PR contains no product code and is safe to review or close. The Codex heartbeat reads merged snapshots before proposing any low-risk optimization PR.
          add-paths: |
            docs/seo/data
            docs/seo/reports

      - name: Preserve audit failure status
        if: steps.audit.outcome == 'failure'
        run: exit 1
