name: Quality Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VOCAB_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository gates
        run: pnpm run gates
      - name: Electron smoke journeys
        run: xvfb-run -a pnpm run test:e2e
      - name: Real user journey suite
        run: xvfb-run -a pnpm run test:journeys

      # 走查证据（截图 + output.jsonl）。win-gate.yml 一直有这步，本 job 却没有——
      # 结果是 ubuntu 这边走查一红就只剩一行「✗ 某某检查」，几何类失败隔着 CI 根本判不了因
      # （2026-08-26 实际卡在这：只知道 withinStage=false，拿不到矩形数就没法定位）。
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-walkthrough-evidence
          path: |
            evals/runs/**/screenshots/**
            evals/runs/**/output.jsonl
          if-no-files-found: warn
          retention-days: 7
  mac-package:
    name: Mac Package
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Package macOS app
        run: pnpm run dist:mac:dir
      - name: Verify macOS signature
        run: codesign --verify --deep --strict --verbose=4 release/mac-arm64/Nomi.app
