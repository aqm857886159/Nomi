name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  # Merge queue builds run required checks on the speculative merge result;
  # without this trigger a queued PR waits forever for checks that never start.
  merge_group:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Reachable vocabulary baseline for a manual current-HEAD recovery run
        required: false
        default: origin/main
        type: string
      validation_mode:
        description: Manual runs are always full; keep this explicit for auditability
        required: false
        default: full
        type: choice
        options:
          - full

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  scope:
    name: Validation Scope
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.profile.outputs.unit }}
      desktop: ${{ steps.profile.outputs.desktop }}
      walkthroughs: ${{ steps.profile.outputs.walkthroughs }}
      journeys: ${{ steps.profile.outputs.journeys }}
      canvas: ${{ steps.profile.outputs.canvas }}
      performance: ${{ steps.profile.outputs.performance }}
      package: ${{ steps.profile.outputs.package }}
      release: ${{ steps.profile.outputs.release }}
      fail_closed: ${{ steps.profile.outputs.fail_closed }}
      reason: ${{ steps.profile.outputs.reason }}
      changed_count: ${{ steps.profile.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select fail-closed validation profile
        id: profile
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NOMI_VALIDATION_MODE: ${{ inputs.validation_mode || '' }}
          NOMI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          NOMI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/select-quality-gate-profile.mjs

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    env:
      VOCAB_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_ref }}
      ROOT_CAUSE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static contracts, lint, and types
        run: pnpm run test:system:contracts

  unit:
    name: Unit
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit and agent runtime tests (full lane)
        if: needs.scope.outputs.unit == 'full'
        run: pnpm run test:system:unit
      - name: Changed and related tests (fast lane)
        if: needs.scope.outputs.unit == 'focused'
        env:
          NOMI_CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
          NOMI_CHANGED_HEAD: ${{ github.sha }}
        run: pnpm run test:system:focused

  desktop-linux:
    name: E2E Walkthroughs (Linux)
    needs: scope
    if: >-
      needs.scope.outputs.desktop == 'true' ||
      needs.scope.outputs.walkthroughs == 'true' ||
      needs.scope.outputs.journeys == 'true' ||
      needs.scope.outputs.canvas != 'none' ||
      needs.scope.outputs.performance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build selected desktop surfaces once
        run: pnpm run build
      - name: Electron smoke
        if: needs.scope.outputs.desktop == 'true'
        run: xvfb-run -a pnpm run test:e2e
      - name: CI-safe user journeys
        if: needs.scope.outputs.journeys == 'true'
        run: xvfb-run -a pnpm run test:journeys
      - name: MCP L1 handshake journey
        if: needs.scope.outputs.journeys == 'true'
        run: xvfb-run -a pnpm run test:mcp-journey
      # 走查过去是「写完没人跑」的资产：产品按 §1.5 搬家后它们静默腐烂，两次都是红了很久
      # 才被偶然发现（2026-06 的 j3/j5、2026-08 的语言钮 5 处死锚点红了一个月）。
      # 清单与准入门槛见 tests/ux/ci-roster.mjs：只收零额度 + 确定性 + 已实测跑绿的走查。
      - name: CI-safe walkthrough roster
        if: needs.scope.outputs.walkthroughs == 'true'
        run: xvfb-run -a pnpm run test:walkthroughs:ci
      - name: Critical canvas acceptance
        if: needs.scope.outputs.canvas == 'critical'
        run: xvfb-run -a pnpm run test:canvas:critical
      - name: Full functional canvas acceptance
        if: needs.scope.outputs.canvas == 'full'
        run: xvfb-run -a pnpm run test:canvas:acceptance
      - name: Canvas performance budget
        if: needs.scope.outputs.performance == 'true'
        run: xvfb-run -a pnpm run test:canvas:performance

      # 走查证据（截图 + output.jsonl）。win-gate.yml 一直有这步，本 job 却没有——
      # 结果是 ubuntu 这边走查一红就只剩一行「✗ 某某检查」，几何类失败隔着 CI 根本判不了因
      # （2026-08-26 实际卡在这：只知道 withinStage=false，拿不到矩形数就没法定位）。
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-walkthrough-evidence
          path: |
            evals/runs/**/screenshots/**
            evals/runs/**/output.jsonl
            outputs/canvas-acceptance/**
            outputs/canvas-smoke/**
            outputs/canvas-card-stack-20260827/**
            tests/system/runs/**/report.md
            tests/system/runs/**/summary.json
            tests/ux/shots/canvas-drag-pan-gestures/**
            tests/ux/shots/group-ports/**
            tests/ux/shots/react-flow-read-only/**
            tests/ux/perf-results/canvas-*.json
          if-no-files-found: warn
          retention-days: 7
  mac-package:
    name: Mac Package
    needs: scope
    if: needs.scope.outputs.package == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Package macOS app
        run: pnpm run dist:mac:dir
      - name: Verify macOS signature
        run: codesign --verify --deep --strict --verbose=4 release/mac-arm64/Nomi.app

  quality:
    name: Quality Gate
    needs: [scope, contracts, unit, desktop-linux, mac-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit CI annotations
        id: ci-hygiene
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-annotation-hygiene.mjs
      - name: Upload CI hygiene evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-hygiene-evidence
          path: outputs/ci-hygiene/ci-annotations.json
          if-no-files-found: error
          retention-days: 7
      - name: Require every validation surface
        if: ${{ always() }}
        run: |
          test "${{ steps.ci-hygiene.outcome }}" = "success"
          test "${{ needs.scope.result }}" = "success"
          test "${{ needs.contracts.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          if [ "${{ needs.scope.outputs.desktop }}" = "true" ] || \
             [ "${{ needs.scope.outputs.journeys }}" = "true" ] || \
             [ "${{ needs.scope.outputs.canvas }}" != "none" ] || \
             [ "${{ needs.scope.outputs.performance }}" = "true" ]; then
            test "${{ needs['desktop-linux'].result }}" = "success"
          fi
          if [ "${{ needs.scope.outputs.package }}" = "true" ]; then
            test "${{ needs['mac-package'].result }}" = "success"
          fi
