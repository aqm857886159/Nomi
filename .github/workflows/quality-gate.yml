name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Reachable vocabulary baseline for a manual current-HEAD recovery run
        required: false
        default: origin/main
        type: string

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VOCAB_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
      ROOT_CAUSE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static contracts, lint, and types
        run: pnpm run test:system:contracts

  unit:
    name: Unit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit and agent runtime tests
        run: pnpm run test:system:unit

  desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and run desktop journeys
        run: xvfb-run -a pnpm run test:system:desktop
      - name: Project Agent MCP journey
        run: xvfb-run -a pnpm run test:mcp
      - name: Project Agent Surface isolation
        run: xvfb-run -a node tests/ux/project-agent-canvas-isolation.e2e.mjs

      # 走查证据（截图 + output.jsonl）。win-gate.yml 一直有这步，本 job 却没有——
      # 结果是 ubuntu 这边走查一红就只剩一行「✗ 某某检查」，几何类失败隔着 CI 根本判不了因
      # （2026-08-26 实际卡在这：只知道 withinStage=false，拿不到矩形数就没法定位）。
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-walkthrough-evidence
          path: |
            evals/runs/**/screenshots/**
            evals/runs/**/output.jsonl
          if-no-files-found: warn
          retention-days: 7
  mac-package:
    name: Mac Package
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Package macOS app
        run: pnpm run dist:mac:dir
      - name: Verify macOS signature
        run: codesign --verify --deep --strict --verbose=4 release/mac-arm64/Nomi.app

  quality:
    name: Quality Gate
    needs: [contracts, unit, desktop-linux, mac-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation surface
        run: |
          test "${{ needs.contracts.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs['desktop-linux'].result }}" = "success"
          test "${{ needs['mac-package'].result }}" = "success"
