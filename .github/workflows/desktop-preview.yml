name: Desktop Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  mac-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-preview')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 反馈回路的出厂配置（W-01）。烤进 dist-electron/intake-config.json，随 app.asar 出厂。
      # 令牌是**发布令牌**不是密钥：它随包发出去、解包就能拿到；接收端只能写不能读/列/删。
      - name: Build with the shipped feedback intake configured
        env:
          NOMI_INTAKE_ENDPOINT: ${{ secrets.NOMI_INTAKE_ENDPOINT }}
          NOMI_INTAKE_TOKEN: ${{ secrets.NOMI_INTAKE_TOKEN }}
        run: pnpm run build
      - name: Package Nomi Preview for Apple Silicon
        run: pnpm exec electron-builder --config electron-builder.preview.cjs --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nomi-preview-mac-arm64
          path: release-preview/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-preview')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 反馈回路的出厂配置（W-01）。烤进 dist-electron/intake-config.json，随 app.asar 出厂。
      # 令牌是**发布令牌**不是密钥：它随包发出去、解包就能拿到；接收端只能写不能读/列/删。
      - name: Build with the shipped feedback intake configured
        env:
          NOMI_INTAKE_ENDPOINT: ${{ secrets.NOMI_INTAKE_ENDPOINT }}
          NOMI_INTAKE_TOKEN: ${{ secrets.NOMI_INTAKE_TOKEN }}
        run: pnpm run build
      - name: Package Nomi Preview for Windows
        run: pnpm exec electron-builder --config electron-builder.preview.cjs --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nomi-preview-windows-x64
          path: release-preview/*.exe
          if-no-files-found: error
          retention-days: 7
