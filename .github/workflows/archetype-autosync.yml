name: Archetype Defaults Autosync

# 档案默认值桥接表（electron/catalog/archetype*.generated.ts）是从档案生成的。原来的 check:archetype-defaults
# 用 --check 在 PR 上红灯拦「忘了重新生成」，2026-10-02 起改成自动重新生成（门岗账本：能自动修的不拦人）：
# main 每前进一次就从档案重新生成一遍，有 diff 就更新同一条 bot PR；没有 diff 时 action 会关掉旧 PR。
#
# 为什么不并进 docs-autosync：那条流水线的不变量是「只写 docs/」（docs/fixes/docs-autosync.node-test.mjs 钉死），
# 这里写的是生成的代码文件，写入面不同，所以单独一条、单独一个固定分支，写入范围只放那三类生成文件。
# 不用 git push、不跳 CI：和 docs-autosync 一样靠默认 token 的事件语义避免递归，PR 的 CI 需要维护者批准后才跑。

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# 固定分支只允许一个写者；每班读取当前 main，重新生成是幂等的，不取消在途。
concurrency:
  group: archetype-autosync
  cancel-in-progress: false

jobs:
  autosync:
    name: Archetype Defaults Autosync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 生成器是 tsx 脚本，需要依赖；--ignore-scripts 不跑安装后脚本（这里用不到 git hooks 与 Electron 下载）。
      - uses: ./.github/actions/cache-external-downloads
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate archetype wire defaults
        run: pnpm run gen:archetype-defaults

      - name: Update the single archetype repair PR
        id: publish
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/archetype-autosync
          delete-branch: false
          commit-message: "chore(archetype): auto-sync 档案默认值桥接表"
          title: "chore(archetype): auto-sync 档案默认值桥接表"
          body: |
            Automated regeneration of the archetype wire-defaults bridge tables from current main (`pnpm run gen:archetype-defaults`).

            Only the generated files below are written; hand edits belong in the archetype sources, never here. The action closes this PR when no regeneration diff remains.

            Publishing uses GITHUB_TOKEN. Token-generated push events do not start new workflow runs, preventing recursion without CI skip markers; a maintainer must approve the PR's workflow runs before required checks can complete.
          add-paths: |
            electron/catalog/archetypeWireDefaults.generated.ts
            electron/catalog/archetypeWireDefaults.*.generated.ts
            electron/catalog/archetypeIdentifiers.generated.ts
            electron/catalog/archetypeModes.generated.ts
            electron/catalog/archetypeModes.*.generated.ts
