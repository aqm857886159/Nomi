<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomi Skill 聚合站 · 展示格式 mockup v0</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#ffffff; --border:#e5e5e7; --text:#1d1d1f; --text2:#6e6e73;
    --blue:#185FA5; --bluebg:#E6F1FB; --teal:#0F6E56; --tealbg:#E1F5EE;
    --amber:#854F0B; --amberbg:#FAEEDA; --red:#A32D2D; --redbg:#FCEBEB;
    --purple:#534AB7; --purplebg:#EEEDFE; --coral:#993C1D; --coralbg:#FAECE7;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
  .masthead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:6px 0 4px}
  .masthead h1{font-size:22px;font-weight:600}
  .masthead .tagline{color:var(--text2);font-size:13px}
  .note{background:var(--amberbg);color:var(--amber);border:1px solid #f0d9a8;border-radius:var(--radius-sm);padding:8px 14px;font-size:12px;margin:14px 0 20px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .search{flex:1;min-width:220px;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:14px;outline:none}
  .search:focus{border-color:var(--blue)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text2);user-select:none}
  .chip:hover{border-color:var(--blue);color:var(--blue)}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s, transform .1s;display:flex;flex-direction:column;gap:10px}
  .card:hover{border-color:var(--blue);transform:translateY(-1px)}
  .badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bd{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;line-height:1.5}
  .bd.official{background:var(--bluebg);color:var(--blue)}
  .bd.curated{background:var(--tealbg);color:var(--teal)}
  .bd.candidate{background:#f2f2f2;color:var(--text2)}
  .bd.verified{background:var(--tealbg);color:var(--teal)}
  .bd.noverify{background:var(--amberbg);color:var(--amber)}
  .bd.security-ok{background:var(--tealbg);color:var(--teal)}
  .bd.security-none{background:var(--amberbg);color:var(--amber)}
  .card h3{font-size:15px;font-weight:600;line-height:1.4}
  .repo{font-size:12px;color:var(--text2);font-family:ui-monospace,Menlo,monospace}
  .desc{font-size:13px;color:var(--text);flex:1}
  .meta{display:flex;gap:10px;font-size:12px;color:var(--text2);flex-wrap:wrap}
  .meta span{white-space:nowrap}
  .domain-tags{display:flex;gap:6px;flex-wrap:wrap}
  .dtag{font-size:11px;padding:1px 8px;border-radius:6px;background:#f2f2f2;color:#555}
  .dtag.domain{background:var(--purplebg);color:var(--purple)}
  .dtag.craft{background:var(--coralbg);color:var(--coral)}
  .footer-note{margin-top:28px;font-size:12px;color:var(--text2);text-align:center;border-top:1px solid var(--border);padding-top:16px}
  .count{margin-bottom:10px;font-size:13px;color:var(--text2)}
  /* detail drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
  .overlay.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--card);z-index:50;transform:translateX(105%);transition:transform .22s ease;overflow-y:auto;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
  .drawer.open{transform:translateX(0)}
  .drawer-inner{padding:26px 28px 60px}
  .close{position:sticky;top:0;float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);padding:4px 6px}
  .d-title{font-size:20px;font-weight:600;margin:6px 0 2px}
  .d-repo{font-size:12px;color:var(--text2);font-family:ui-monospace,Menlo,monospace;margin-bottom:12px}
  .d-desc{font-size:14px;margin:8px 0 16px}
  .section{margin:20px 0}
  .section h4{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .tabs{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:10px}
  .tab{flex:1;padding:9px;font-size:13px;text-align:center;cursor:pointer;background:var(--card);border:none;color:var(--text2)}
  .tab.active{background:var(--blue);color:#fff}
  .tabbody{background:#f8f8fa;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;display:none}
  .tabbody.active{display:block}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .kv:last-child{border:none}
  .kv .k{color:var(--text2);flex-shrink:0}
  .kv .v{text-align:right;word-break:break-all}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:0 0 14px;align-items:center}
  .legend .lg{display:inline-flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.blue{background:var(--blue)} .dot.teal{background:var(--teal)} .dot.gray{background:#b0b0b3} .dot.amber{background:#d99a2b}
  .empty{text-align:center;color:var(--text2);padding:40px 0}
</style>
</head>

<div class="wrap">

    <h1>Nomi Skill 聚合站</h1>
    <span class="tagline">展示格式 mockup v0 · 数据源 catalog.sample.json（56 条采集样例）</span>
  </div>
  <div class="note">这是「收录格式 → 展示格式」的可点击原型：卡片 = 列表页，点击卡片 = 详情页（三态安装入口 + SKILL.md 预览 + 安全审计位）。正式数据待 P0 采集管线用 skills-ref validate 校验、补 frontmatter 原文后回填。GitHub 源已做存活性核验。</div>

  <div class="legend">
    <span class="lg"><i class="dot blue"></i>官方</span>
    <span class="lg"><i class="dot teal"></i>已策展/已验证</span>
    <span class="lg"><i class="dot gray"></i>候选</span>
    <span class="lg"><i class="dot amber"></i>未过安全审计</span>
  </div>

  <div class="toolbar">
    <input class="search" id="q" placeholder="搜索技能名 / owner / 描述…" />
    <div class="chips" id="domains"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>

</div>

s"}, {"id": "vercel-labs/skills::cli", "owner": "vercel-labs", "repo": "skills", "name": "skills-cli", "skillPath": "", "version": "1.5.x", "summary": "npx skills 安装 CLI（本生态分发工具）", "domain": "collection", "craft": "producer", "license": "MIT", "source": {"type": "github", "url": "https://github.com/vercel-labs/skills", "ref": "", "publishedVia": "", "collectedAt": "2026-09-07", "verified": true}, "validation": {"status": "unknown"}, "security": {"auditStatus": "unscanned", "verified": "official"}, "stats": {"installs": 0, "stars": 0, "updatedAt": ""}, "curation": {"status": "official"}, "kind": "skill", "preview": {"kind": "none", "requiredForFeatured": false}, "title": "skills-cli"}];
init();

const state={domain:'all',q:''};
function init(){
  buildDomainChips();
  render();
}
function buildDomainChips(){
  const host=document.getElementById('domains');
  host.innerHTML='';
  const all=document.createElement('div');
  all.className='chip active';all.textContent='全部';all.onclick=()=>{state.domain='all';refreshChips();render();};
  host.appendChild(all);
  Object.keys(DOMAIN_META).forEach(d=>{
    const c=document.createElement('div');
    c.className='chip';c.textContent=DOMAIN_META[d].label;c.dataset.d=d;
    c.onclick=()=>{state.domain=d;refreshChips();render();};
    host.appendChild(c);
  });
}
function refreshChips(){
  document.querySelectorAll('#domains .chip').forEach(ch=>ch.classList.toggle('active', ch.dataset.d===state.domain || (!ch.dataset.d && state.domain==='all')));
}
function curationBadge(cur){
  if(cur.status==='official') return '<span class="bd official">官方</span>';
  if(cur.status==='curated') return '<span class="bd curated">策展收录</span>';
  return '<span class="bd candidate">候选</span>';
}
function verifyBadge(v){
  if(v==='official') return '<span class="bd verified">官方源</span>';
  if(v===true||v==='community') return '<span class="bd verified">已验证</span>';
  if(v==='redirect') return '<span class="bd noverify">改名重定向</span>';
  return '<span class="bd noverify">未验证</span>';
}
function secBadge(s){
  if(s.auditStatus==='scanned-pass') return '<span class="bd security-ok">安全审计通过</span>';
  if(s.auditStatus==='scanned-fail') return '<span class="bd security-ok" style="background:var(--redbg);color:var(--red)">审计未过</span>';
  return '<span class="bd security-none">未过第三方审计</span>';
}
function render(){
  const q=state.q.trim().toLowerCase();
  const list=DATA.filter(e=>{
    if(state.domain!=='all' && e.domain!==state.domain) return false;
    if(!q) return true;
    const hay=(e.name+' '+e.summary+' '+e.owner+' '+e.repo+' '+(e.domain||'')).toLowerCase();
    return hay.includes(q);
  });
  const host=document.getElementById('grid');
  const count=document.getElementById('count');
  count.textContent='共 '+DATA.length+' 条采集 · 当前显示 '+list.length+' 条';
  if(!list.length){host.innerHTML='<div class="empty">没有匹配的技能</div>';return;}
  host.innerHTML=list.map(entryCard).join('');
  host.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}
function entryCard(e){
  const dm=DOMAIN_META[e.domain]||{label:e.domain,color:'gray'};
  const adapt=e.adapterForNomi? ' · 需适配':'';
  return `<div class="card" data-id="${e.id}">
    <div class="badges">${curationBadge(e.curation)}${verifyBadge(e.source.verified)}${secBadge(e.security)}</div>
    <h3>${escapeHtml(e.name)}${adapt? '<span style="color:var(--text2);font-weight:400;font-size:12px">'+adapt+'</span>':''}</h3>
    <div class="repo">${e.owner}/${e.repo||''}</div>
    <div class="desc">${escapeHtml(e.summary)}</div>
    <div class="domain-tags"><span class="dtag domain">${dm.label}</span>${e.craft? `<span class="dtag craft">${e.craft}</span>`:''}</div>
    <div class="meta"><span>⬇ ${e.stats?e.stats.installs:'0'}</span><span>★ ${e.stats?e.stats.stars:'0'}</span><span>${e.license?e.license:'—'}</span></div>
  </div>`;
}
function openDetail(id){
  const e=DATA.find(x=>x.id===id); if(!e) return;
  const dm=DOMAIN_META[e.domain]||{label:e.domain};
  const installCmd=`npx skills add ${e.owner}/${e.repo} --skill ${e.name}`;
  const nomiCmd=`nomi skill install ${e.owner}/${e.repo}@${e.name}`;
  const agentPrompt=`请先阅读 https://github.com/${e.owner}/${e.repo} 中 ${e.name}/SKILL.md 的完整内容，评估它做什么、依赖什么工具，再决定是否值得安装。若值得，请按你的宿主规范把技能装到 skills 目录。`;
  const drawer=document.getElementById('drawer');
  drawer.innerHTML=`
    <div class="drawer-inner">
      <button class="close" onclick="closeDetail()">×</button>
      <div class="badges" style="margin-top:8px">${curationBadge(e.curation)}${verifyBadge(e.source.verified)}${secBadge(e.security)}</div>
      <div class="d-title">${escapeHtml(e.name)}</div>
      <div class="d-repo">github.com/${e.owner}/${e.repo}${e.skillPath?' / '+e.skillPath:''}</div>
      <div class="d-desc">${escapeHtml(e.summary)}</div>
      <div class="domain-tags" style="margin-bottom:6px"><span class="dtag domain">${dm.label}</span>${e.craft?`<span class="dtag craft">${e.craft}</span>`:''}</div>

      <div class="section">
        <h4>安装</h4>
        <div class="tabs">
          <button class="tab active" data-t="0">① Agent 先审</button>
          <button class="tab" data-t="1">② 命令安装</button>
          <button class="tab" data-t="2">③ 下载副本</button>
        </div>
        <div class="tabbody active">${agentPrompt}</div>
        <div class="tabbody">${installCmd}\n\n# Nomi 桌面端：\n${nomiCmd}</div>
        <div class="tabbody">wget https://github.com/${e.owner}/${e.repo}/archive/refs/heads/${e.source.ref||'main'}.zip\n# 解压后取 ${e.name} 目录即可（纯方法论技能也可只拷 SKILL.md）</div>
      </div>

      <div class="section">
        <h4>它要什么</h4>
        ${e.adapterForNomi? `
          <div class="kv"><span class="k">适配需求</span><span class="v">${e.adapterForNomi.needs}</span></div>
          ${e.adapterForNomi.notes?`<div class="kv"><span class="k">适配备注</span><span class="v">${e.adapterForNomi.notes}</span></div>`:''}
        `:`<div class="kv"><span class="k">Nomi 适配</span><span class="v">纯方法论 / 待评估</span></div>`}
        <div class="kv"><span class="k">领域</span><span class="v">${dm.label}</span></div>
        ${e.craft?`<div class="kv"><span class="k">内容工种</span><span class="v">${e.craft}</span></div>`:''}
        <div class="kv"><span class="k">许可证</span><span class="v">${e.license||'未声明'}</span></div>
        <div class="kv"><span class="k">来源</span><span class="v"><a href="${e.source.url}" target="_blank">${e.source.url}</a></span></div>
      </div>

      <div class="section">
        <h4>SKILL.md 预览</h4>
        <div class="tabbody active" style="display:block">---\nname: ${e.name}\ndescription: ${e.summary}（frontmatter 原文待 P0 采集管线回填）\n---\n\n# ${e.name}\n\n（正文只读预览：渐进披露，仅激活后注入，参考 <500 行）</div>
      </div>
      <div class="footer-note" style="text-align:left;border:none;padding-top:8px">收录 ≠ 官方推荐 · 装前请自查 SKILL.md 与 license</div>
    </div>`;
  drawer.classList.add('open');
  document.getElementById('overlay').classList.add('open');
  drawer.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    drawer.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
    drawer.querySelectorAll('.tabbody').forEach((b,i)=>b.classList.toggle('active', i===+t.dataset.t));
  });
}
function closeDetail(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').onclick=closeDetail;
document.getElementById('q').addEventListener('input',ev=>{state.q=ev.target.value;render();});
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
