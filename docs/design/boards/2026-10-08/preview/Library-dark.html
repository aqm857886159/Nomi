<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>项目库</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nm{--bg:oklch(0.985 0.003 90);--paper:oklch(1 0 0);--chrome:oklch(0.97 0.003 80);--ink:oklch(0.22 0.01 80);--ink80:oklch(0.32 0.01 80);--ink60:oklch(0.50 0.01 80);--ink40:oklch(0.68 0.01 80);--ink30:oklch(0.78 0.01 80);--ink20:oklch(0.88 0.005 80);--ink10:oklch(0.94 0.003 80);--ink05:oklch(0.97 0.003 80);--line:oklch(0.91 0.004 80);--lineSoft:oklch(0.95 0.003 80);--accent:oklch(0.55 0.13 250);--accentSoft:color-mix(in srgb, oklch(0.55 0.13 250) 12%, white);--infoInk:oklch(0.45 0.13 250);--infoSoft:oklch(0.957 0.021 250);--infoEdge:oklch(0.9 0.048 250);--okInk:oklch(0.45 0.09 145);--okSoft:oklch(0.962 0.033 145);--logo:oklch(0.22 0.01 80);--shSm:0 1px 2px oklch(0 0 0 / 0.04),0 1px 1px oklch(0 0 0 / 0.03);--shMd:0 2px 4px oklch(0 0 0 / 0.04),0 8px 24px oklch(0 0 0 / 0.06);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;position:relative;width:1280px;height:800px;overflow:hidden;background:var(--chrome)}
.nm.dark{--bg:oklch(0.18 0.006 80);--paper:oklch(0.235 0.007 80);--chrome:oklch(0.155 0.006 80);--ink:oklch(0.93 0.006 85);--ink80:oklch(0.84 0.006 85);--ink60:oklch(0.70 0.006 85);--ink40:oklch(0.62 0.006 85);--ink30:oklch(0.50 0.006 85);--ink20:oklch(0.42 0.006 85);--ink10:oklch(0.34 0.006 85);--ink05:oklch(0.30 0.006 85);--line:oklch(0.36 0.007 80);--lineSoft:oklch(0.31 0.007 80);--accent:oklch(0.70 0.13 250);--accentSoft:color-mix(in srgb, oklch(0.70 0.13 250) 26%, oklch(0.235 0.007 80));--infoInk:oklch(0.82 0.13 250);--infoSoft:oklch(0.295 0.045 250);--infoEdge:oklch(0.395 0.065 250);--okInk:oklch(0.82 0.09 145);--okSoft:oklch(0.295 0.042 145);--logo:oklch(0.30 0.01 80);--shSm:0 1px 2px oklch(0 0 0 / 0.32),0 1px 1px oklch(0 0 0 / 0.22);--shMd:0 2px 5px oklch(0 0 0 / 0.30),0 14px 34px oklch(0 0 0 / 0.32)}
:where(.nm) *{box-sizing:border-box}
:where(.nm) button{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
:where(.nm) input{font:inherit;color:inherit}
.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i14{width:14px;height:14px}.i16{width:16px;height:16px}.i18{width:18px;height:18px}.i24{width:24px;height:24px}
.tnum{font-variant-numeric:tabular-nums}
.tb{position:absolute;left:0;top:0;right:0;height:40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tb-l{display:flex;align-items:center;gap:8px;padding-left:12px}
.tb-r{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.here{font-size:13px;font-weight:500;color:var(--ink)}
.ib{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink60);position:relative}
.badge{height:16px;min-width:16px;padding:0 5px;border-radius:999px;background:var(--infoSoft);color:var(--infoInk);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center}
.tasks{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px;border-radius:6px;color:var(--ink60)}
.upd{display:flex;align-items:center;gap:4px;height:24px;padding:0 10px 0 8px;margin:0 4px;border-radius:999px;background:var(--infoSoft);color:var(--infoInk);font-size:12px;font-weight:500}
.dotmark{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--chrome)}
.wc{display:flex;margin-left:6px}
.wc span{width:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink80)}
.wc svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1}
.rail{position:absolute;left:0;top:40px;bottom:0;width:60px;display:flex;flex-direction:column;align-items:center;padding:6px 0 10px}
.ri{width:48px;height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink60)}
.ri span{font-size:11px;line-height:13px}
.rail .grow{flex:1}
.work{position:absolute;left:8px;top:40px;right:8px;bottom:8px;border-radius:10px;background:var(--paper);box-shadow:0 0 0 1px var(--lineSoft);overflow:hidden;padding:24px 32px}
.hd{display:flex;align-items:center;gap:12px;height:32px}
.h{font-size:16px;font-weight:600}
.seg{display:flex;align-items:center;gap:2px;height:28px;padding:2px;border-radius:999px;background:var(--ink05)}
.seg>button{height:24px;padding:0 10px;border-radius:999px;font-size:12px;color:var(--ink60);display:flex;align-items:center;gap:4px}
.seg>button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:var(--shSm)}
.seg .c{color:var(--ink40)}
.search{display:flex;align-items:center;gap:6px;height:28px;width:200px;padding:0 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:12px;color:var(--ink40)}
.pillbtn{height:28px;padding:0 12px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--line);font-size:12px;font-weight:500;color:var(--ink80);display:flex;align-items:center;gap:6px}
.pillbtn .i{color:var(--ink60)}
.primary{height:28px;padding:0 14px 0 10px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px}
.note{display:flex;align-items:center;gap:10px;height:44px;margin-top:20px;padding:0 8px 0 14px;border-radius:10px;background:var(--infoSoft);box-shadow:inset 0 0 0 1px var(--infoEdge);font-size:13px;color:var(--infoInk)}
.note .lk{margin-left:auto;height:28px;padding:0 12px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--infoEdge);font-size:12px;font-weight:500;color:var(--infoInk)}
.grid{display:grid;grid-template-columns:repeat(4,248px);column-gap:24px;row-gap:24px;margin-top:24px}
.pc{width:248px}
.cv{width:248px;height:140px;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px oklch(0 0 0 / 0.04)}
.cv.empty{background:var(--ink05);box-shadow:inset 0 0 0 1px var(--lineSoft);display:flex;align-items:center;justify-content:center;color:var(--ink30)}
.pn{margin-top:10px;font-size:13px;font-weight:600;color:var(--ink)}
.pm{margin-top:3px;font-size:12px;color:var(--ink40);display:flex;align-items:center;gap:6px}
.loc{height:18px;padding:0 6px;border-radius:4px;background:var(--ink05);font-size:11px;color:var(--ink60);display:flex;align-items:center}
.m{position:absolute;inset:0}
.m1{background:radial-gradient(circle at 72% 30%,rgba(255,255,255,.26) 0 14px,transparent 15px),radial-gradient(130% 70% at 25% 112%,rgba(8,10,16,.55) 0 55%,transparent 56%),linear-gradient(165deg,#3b4b67 0%,#1a2232 72%)}
.c2{background:radial-gradient(circle at 30% 40%,rgba(255,214,170,.55) 0 22px,transparent 23px),linear-gradient(180deg,#f1c79a 0%,#d98f6a 45%,#5d4a5e 100%)}
.c3{background:linear-gradient(160deg,#cfe0d2 0%,#7fa08c 55%,#33463c 100%)}
.tabs{display:flex;align-items:baseline;gap:20px}
.tabs button{font-size:16px;font-weight:600;color:var(--ink40);height:32px;display:flex;align-items:center}
.tabs button.on{color:var(--ink)}
</style>
</helmet>
<div class="nm dark">
  <div class="tb">
    <div class="tb-l">
      <svg width="20" height="20" viewBox="0 0 28 28" aria-label="Nomi"><rect width="28" height="28" rx="7" fill="var(--logo)"></rect><rect x="5.5" y="5.5" width="4" height="17" rx="1.2" fill="white"></rect><rect x="18.5" y="5.5" width="4" height="17" rx="1.2" fill="white"></rect><polygon points="9.5,5.5 13.5,5.5 18.5,22.5 14.5,22.5" fill="white"></polygon></svg>
      <span class="here">项目库</span>
    </div>
    <div></div>
    <div class="tb-r">
      <button class="tasks" type="button" aria-label="任务"><svg class="i i18" viewBox="0 0 24 24"><path d="M3.5 5.5l1.5 1.5l2.5 -2.5"></path><path d="M3.5 11.5l1.5 1.5l2.5 -2.5"></path><path d="M3.5 17.5l1.5 1.5l2.5 -2.5"></path><path d="M11 6l9 0"></path><path d="M11 12l9 0"></path><path d="M11 18l9 0"></path></svg></button>
      <button class="ib" type="button" aria-label="浏览器"><svg class="i i18" viewBox="0 0 24 24"><path d="M4 4m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z"></path><path d="M4 8h16"></path><path d="M8 4v4"></path></svg></button>
      <button class="upd" type="button"><svg class="i i14" viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"></path><path d="M7 11l5 5l5 -5"></path><path d="M12 4l0 12"></path></svg>新版本</button>
      <button class="ib" type="button" aria-label="设置"><svg class="i i18" viewBox="0 0 24 24"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path></svg><span class="dotmark"></span></button>
      <div class="wc" aria-hidden="true">
        <span><svg viewBox="0 0 10 10"><path d="M0 5.5h10"></path></svg></span>
        <span><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"></rect></svg></span>
        <span><svg viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg></span>
      </div>
    </div>
  </div>


  <main class="work">
    <div class="hd" style="position: relative;gap:16px">
      <div class="tabs" role="tablist" aria-label="库">
        <button type="button" role="tab" aria-selected="true" class="on">项目</button>
        <button type="button" role="tab" aria-selected="false">Skill</button>
        <button type="button" role="tab" aria-selected="false">提示词</button>
      </div>
      <div class="seg" role="tablist" aria-label="筛选">
        <button type="button" class="on">全部 <span class="c tnum">3</span></button>
        <button type="button">本地新建 <span class="c tnum">2</span></button>
        <button type="button">外部文件夹 <span class="c tnum">1</span></button>
      </div>
      <div class="search"><svg class="i i14" viewBox="0 0 24 24"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path><path d="M21 21l-6 -6"></path></svg>搜索项目</div>
      <span style="flex:1"></span>
      <button class="pillbtn" type="button"><svg class="i i14" viewBox="0 0 24 24"><path d="M5 19l2.757 -7.351a1 1 0 0 1 .936 -.649h12.307a1 1 0 0 1 .986 1.164l-.996 5.211a2 2 0 0 1 -1.964 1.625h-14.026a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v2"></path></svg>打开文件夹</button>
      <button class="primary" type="button"><svg class="i i14" viewBox="0 0 24 24"><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>新建项目</button>
    </div>
    <div class="note">
      <svg class="i i16" viewBox="0 0 24 24"><path d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5z"></path><path d="M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5z"></path><path d="M3 21l2.5 -2.5"></path><path d="M18.5 5.5l2.5 -2.5"></path><path d="M10 11l-2 2"></path><path d="M13 14l-2 2"></path></svg>
      创作助手还没连接模型：写剧本、拆分镜前先连一个
      <button class="lk" type="button">连接模型</button>
    </div>
    <div class="grid">
      <div class="pc"><div class="cv"><div class="m m1"></div></div><div class="pn">雨夜来信</div><div class="pm tnum">刚刚 · 7 镜 · 0:30</div></div>
      <div class="pc"><div class="cv"><div class="m c2"></div></div><div class="pn">城市晨跑</div><div class="pm tnum">昨天 · 12 镜 · 0:58</div></div>
      <div class="pc"><div class="cv"><div class="m c3"></div></div><div class="pn">山里的小店</div><div class="pm tnum"><span class="loc">外部文件夹</span>10 月 3 日 · 素材 46</div></div>
      <div class="pc"><div class="cv empty"><svg class="i i24" viewBox="0 0 24 24"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M8 4l0 16"></path><path d="M16 4l0 16"></path><path d="M4 8l4 0"></path><path d="M4 16l4 0"></path><path d="M4 12l16 0"></path><path d="M16 8l4 0"></path><path d="M16 16l4 0"></path></svg></div><div class="pn">未命名项目</div><div class="pm tnum">10 月 1 日 · 还没有内容</div></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { rootClass: this.props.dark ? 'nm dark' : 'nm' };
  }
}
</script>
</body>
</html>
