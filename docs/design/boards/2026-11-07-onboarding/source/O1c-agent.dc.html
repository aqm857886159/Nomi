.ph{color:var(--i60)}
.caret{display:inline-block;width:1px;height:16px;background:var(--ink);margin-left:1px}

.box-i{background:var(--ifs);border-radius:8px;color:var(--ifi)}
.dots{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px}
.abs{position:absolute}
.hr{height:1px;background:var(--line);width:100%}
.ico{flex:none;display:block}
.tip{background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 10px;font-size:12px;line-height:18px;box-shadow:var(--sh-md);white-space:nowrap}

.pop{background:var(--paper);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line),var(--sh-lg)}

.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);margin:0}
.lr{display:flex;align-items:center;gap:12px;padding:10px 12px}
.lr+.lr{box-shadow:inset 0 1px 0 var(--line2)}
.num{font-variant-numeric:tabular-nums}
.badge{width:18px;height:18px;border-radius:999px;background:var(--acc);color:white;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.D .badge{color:oklch(0.18 0.006 80)}.D .tagg{color:var(--i80)}
.wm{font-family:"Fraunces",Georgia,serif;font-weight:400;letter-spacing:-0.02em;line-height:1}
.wm .a{color:var(--acc)}
.fam{height:1px;background:var(--line2);margin:4px 8px}
@keyframes stepglow{0%,30%{background:var(--i05);box-shadow:inset 0 0 0 1px var(--i30)}34%,100%{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}}
.anim1{animation:stepglow 6s infinite;background:var(--i05);box-shadow:inset 0 0 0 1px var(--i30)}.anim2{animation:stepglow 6s 2s infinite}.anim3{animation:stepglow 6s 4s infinite}
