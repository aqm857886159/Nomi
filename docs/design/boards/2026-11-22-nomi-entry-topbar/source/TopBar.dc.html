<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Nomi 顶栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header aria-label="{{t.bar}}" style="position: relative; display: flex; align-items: center; width: {{w}}px; height: 40px; box-sizing: border-box; padding-right: {{padR}}px; background: {{c.chrome}}; color: {{c.ink}}; font-family: Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif; font-size: 13px; line-height: 1; overflow: visible">
<div style="display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; height: 40px; padding-left: {{padL}}px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true" style="display: block; flex: none">
<rect width="28" height="28" rx="7" fill="{{c.ground}}"></rect>
<rect x="5.5" y="5.5" width="4" height="17" rx="1.2" fill="#ffffff"></rect>
<rect x="18.5" y="5.5" width="4" height="17" rx="1.2" fill="#ffffff"></rect>
<polygon points="9.5,5.5 13.5,5.5 18.5,22.5 14.5,22.5" fill="#ffffff"></polygon>
</svg>
<sc-if value="{{isLibrary}}" hint-placeholder-val="{{ false }}">
<span style="padding-left: 2px; font-weight: 500; white-space: nowrap">{{t.library}}</span>
</sc-if>
<sc-if value="{{isProject}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{t.projectMenu}}" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; min-width: 0; padding: 0 6px 0 8px; border: 0; border-radius: 6px; background: transparent; color: {{c.ink}}; font-family: inherit; font-size: 13px; font-weight: 500">
<sc-if value="{{showName}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 0; max-width: {{nameMax}}px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.name}}</span>
</sc-if>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.ink40}}" aria-hidden="true" style="flex: none; stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6l6 -6"></path></svg>
</button>
</sc-if>
</div>
<sc-if value="{{isProject}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; top: 0; left: calc(50% + {{segShift}}px); height: 40px; display: flex; align-items: center; transform: translateX(-50%)">
<nav aria-label="{{t.switch}}" style="display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 2px; box-sizing: border-box; border-radius: 999px; background: {{c.ink10}}; box-shadow: {{segOutline}}">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; border: 0; border-radius: 999px; background: {{s.bg}}; color: {{s.color}}; font-family: inherit; font-size: 13px; font-weight: {{s.weight}}; box-shadow: {{s.shadow}}; white-space: nowrap"><span>{{s.label}}</span><sc-if value="{{s.hasMeta}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; color: {{s.metaColor}}">{{s.meta}}</span></sc-if></button>
</sc-for>
</nav>
<sc-if value="{{isGenerate}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{t.view}}" style="position: absolute; left: 100%; top: 6px; margin-left: 8px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: {{c.ink60}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"></path><path d="M4 12l16 0"></path></svg>
</button>
</sc-if>
</div>
</sc-if>
<div role="toolbar" aria-label="{{t.actions}}" style="display: flex; align-items: center; justify-content: flex-end; gap: 2px; flex: none; height: 40px; padding-right: 8px; box-sizing: border-box">
<sc-if value="{{isPreview}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{t.layout}}" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: {{c.ink60}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M5 4h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1"></path><path d="M5 16h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1"></path><path d="M15 12h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1"></path><path d="M15 4h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.ink40}}" aria-hidden="true" style="stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6l6 -6"></path></svg>
</button>
<button type="button" aria-label="{{t.export}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: {{exportW}}; height: 28px; margin: 0 4px; padding: {{exportPad}}; box-sizing: border-box; border: 0; border-radius: 999px; background: {{c.ink}}; color: {{c.paper}}; font-family: inherit; font-size: 12px; font-weight: 500; white-space: nowrap">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="flex: none; stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"></path><path d="M7 11l5 5l5 -5"></path><path d="M12 4l0 12"></path></svg>
<sc-if value="{{exportFull}}" hint-placeholder-val="{{ true }}">
<span>{{t.export}}</span>
</sc-if>
</button>
</sc-if>
<sc-if value="{{isProject}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{t.tasks}}" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: {{c.ink60}}; font-family: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="flex: none; stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M3.5 5.5l1.5 1.5l2.5 -2.5"></path><path d="M3.5 11.5l1.5 1.5l2.5 -2.5"></path><path d="M3.5 17.5l1.5 1.5l2.5 -2.5"></path><path d="M11 6l9 0"></path><path d="M11 12l9 0"></path><path d="M11 18l9 0"></path></svg>
<sc-if value="{{hasTasks}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; justify-content: center; height: 16px; min-width: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: {{c.accent}}; color: {{c.paper}}; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums">{{tasks}}</span>
</sc-if>
</button>
</sc-if>
<button type="button" aria-label="{{t.browser}}" style="display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: {{c.ink60}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M4 8h16"></path><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"></path><path d="M8 4v4"></path></svg>
</button>
<sc-if value="{{update}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{t.update}}" style="position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; box-sizing: border-box; border: 1px solid transparent; border-radius: 6px; background: transparent; color: {{updColor}}; font-family: inherit; font-size: 13px; font-weight: 500; white-space: nowrap">
<sc-if value="{{updOk}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="flex: none; stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"></path><path d="M7 11l5 5l5 -5"></path><path d="M12 4l0 12"></path></svg></sc-if><sc-if value="{{updErr}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="flex: none; stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M12 9v4"></path><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"></path><path d="M12 16h.01"></path></svg></sc-if>
<sc-if value="{{updateWide}}" hint-placeholder-val="{{ false }}">
<span style="font-variant-numeric: tabular-nums">{{t.update}}</span>
</sc-if>
<sc-if value="{{updateNarrow}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: {{updColor}}"></span>
</sc-if>
</button>
</sc-if>
<button type="button" aria-label="{{t.settings}}" style="position: relative; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: {{c.ink60}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path></svg>
<sc-if value="{{settingsDot}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: {{c.accent}}; box-shadow: 0 0 0 2px {{c.chrome}}"></span>
</sc-if>
</button>
<sc-if value="{{showEntry}}" hint-placeholder-val="{{ true }}">
<dc-import name="NomiEntry" theme="{{theme}}" face="{{face}}" pending="{{pending}}" state="{{entryState}}" lang="{{lang}}" wide="{{wide}}" platform="{{platform}}" hint-size="28px,28px"></dc-import>
</sc-if>
</div>
<sc-if value="{{isWin}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; display: flex; width: 138px; height: 40px; box-sizing: border-box; outline: 1px dashed {{c.ink40}}; outline-offset: -1px; color: {{c.ink60}}">
<span style="display: grid; place-items: center; width: 46px; height: 40px"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" style="stroke-width: 1px"><path d="M0 5h10"></path></svg></span>
<span style="display: grid; place-items: center; width: 46px; height: 40px"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" style="stroke-width: 1px"><rect x="0.5" y="0.5" width="9" height="9"></rect></svg></span>
<span style="display: grid; place-items: center; width: 46px; height: 40px"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" style="stroke-width: 1px"><path d="M0 0l10 10M10 0l-10 10"></path></svg></span>
</div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["zh","en"],"default":"zh"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"page":{"editor":"enum","options":["library","create","generate","preview"],"default":"create"},"width":{"editor":"int","default":700,"min":600,"max":1600},"platform":{"editor":"enum","options":["mac","win"],"default":"mac"},"entry":{"editor":"enum","options":["show","none"],"default":"show"},"face":{"editor":"enum","options":["idle","unread","running","done","failed"],"default":"idle"},"pending":{"editor":"int","default":0,"min":0,"max":300},"entryState":{"editor":"enum","options":["rest","hover","open","focus"],"default":"rest"},"tasks":{"editor":"int","default":0,"min":0,"max":99},"update":{"editor":"boolean","default":false},"updateState":{"editor":"enum","options":["available","downloading","installFailed"],"default":"available"},"updateCompact":{"editor":"boolean","default":false},"pendingCompact":{"editor":"boolean","default":false},"exportCompact":{"editor":"boolean","default":false},"segShift":{"editor":"int","default":0,"min":-300,"max":0},"overlap":{"editor":"boolean","default":false},"settingsDot":{"editor":"boolean","default":true},"metaGen":{"editor":"text","default":""},"metaPreview":{"editor":"text","default":""},"hideMeta":{"editor":"boolean","default":false},"nameMax":{"editor":"int","default":120},"$preview":{"width":700,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var flag = function (v, d) { return v === undefined || v === null ? d : (v === true || v === 'true'); };
    var lang = p.lang === 'en' ? 'en' : 'zh';
    var theme = p.theme === 'dark' ? 'dark' : 'light';
    var page = p.page || 'preview';
    var w = Number(p.width || 700);
    var win = p.platform === 'win';
    var C = theme === 'dark' ? {
      chrome: 'oklch(0.155 0.006 80)', paper: 'oklch(0.235 0.007 80)', ink: 'oklch(0.93 0.006 85)', ink60: 'oklch(0.70 0.006 85)',
      ink40: 'oklch(0.62 0.006 85)', ink10: 'oklch(0.34 0.006 85)', ground: 'oklch(0.30 0.01 80)', accent: 'oklch(0.70 0.13 250)',
      danger: 'oklch(0.72 0.13 25)', shadow: '0 1px 2px oklch(0 0 0 / 0.32), 0 1px 1px oklch(0 0 0 / 0.22)'
    } : {
      chrome: 'oklch(0.97 0.003 80)', paper: 'oklch(1 0 0)', ink: 'oklch(0.22 0.01 80)', ink60: 'oklch(0.50 0.01 80)',
      ink40: 'oklch(0.68 0.01 80)', ink10: 'oklch(0.94 0.003 80)', ground: 'oklch(0.22 0.01 80)', accent: 'oklch(0.55 0.13 250)',
      danger: 'oklch(0.55 0.13 25)', shadow: '0 1px 2px oklch(0 0 0 / 0.04), 0 1px 1px oklch(0 0 0 / 0.03)'
    };
    var T = lang === 'en' ? {
      bar: 'Top bar', library: 'Projects', name: 'Untitled project 11/22, 12:00 AM', projectMenu: 'Project menu', switch: 'Switch stage',
      steps: ['Create', 'Generate', 'Preview'], view: 'Canvas / List', actions: 'Global actions', layout: 'Layout', export: 'Export MP4',
      tasks: 'Tasks', browser: 'Open browser', settings: 'Settings',
      updates: { available: 'Update 0.25.0', downloading: 'Downloading update 100%', installFailed: 'Last install failed · Click to retry' }
    } : {
      bar: '顶栏', library: '项目库', name: '未命名项目 11/22 00:00', projectMenu: '项目菜单', switch: '切换阶段',
      steps: ['创作', '生成', '预览'], view: '画布 / 列表', actions: '全局操作', layout: '布局', export: '导出 MP4',
      tasks: '任务', browser: '打开浏览器', settings: '设置',
      updates: { available: '新版本 0.25.0', downloading: '更新下载中 100%', installFailed: '上次没装上 · 点一下重试' }
    };
    T.update = T.updates[p.updateState] || T.updates.available;
    var modes = ['create', 'generate', 'preview'];
    var hideMeta = flag(p.hideMeta, false);
    var metas = { create: '', generate: p.metaGen || '', preview: p.metaPreview || '' };
    var steps = modes.map(function (m, i) {
      var on = m === page;
      return { label: T.steps[i], bg: on ? C.paper : 'transparent', color: on ? C.ink : C.ink60, weight: on ? 500 : 400, shadow: on ? C.shadow : 'none',
        meta: metas[m], hasMeta: !!metas[m] && !hideMeta, metaColor: C.ink40 };
    });
    var nameMax = p.nameMax !== undefined && p.nameMax !== null ? Number(p.nameMax) : (w >= 1100 ? 260 : 120);
    var compact = flag(p.exportCompact, false);
    var tasks = Number(p.tasks || 0);
    var isProject = page !== 'library';
    return {
      t: T, c: C, theme: theme, lang: lang, w: w,
      padL: win ? 12 : 76, padR: win ? 138 : 0,
      isLibrary: !isProject, isProject: isProject, isGenerate: page === 'generate', isPreview: page === 'preview',
      showName: isProject && w >= 900 && nameMax > 0, nameMax: nameMax, wide: w >= 900 && !flag(p.pendingCompact, false), platform: win ? 'win' : 'mac',
      steps: steps, segShift: Number(p.segShift || 0),
      segOutline: flag(p.overlap, false) ? '0 0 0 2px ' + C.danger : 'none',
      exportFull: !compact, exportW: compact ? '28px' : 'auto', exportPad: compact ? '0' : '0 12px',
      hasTasks: tasks > 0, tasks: tasks,
      updErr: p.updateState === 'installFailed', updOk: p.updateState !== 'installFailed', updColor: p.updateState === 'installFailed' ? C.danger : C.accent,
      update: flag(p.update, false), updateWide: w >= 900 && !flag(p.updateCompact, false), updateNarrow: !(w >= 900 && !flag(p.updateCompact, false)),
      settingsDot: flag(p.settingsDot, true),
      showEntry: isProject && p.entry !== 'none',
      face: p.face || 'idle', pending: Number(p.pending || 0), entryState: p.entryState || 'rest',
      isWin: win
    };
  }
}
</script>
</body>
</html>
