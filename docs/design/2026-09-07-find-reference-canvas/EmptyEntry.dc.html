<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: oklch(0.55 0.13 250); } a:hover { color: oklch(0.45 0.13 250); }
    .ib { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; color: oklch(0.68 0.01 80); background: transparent; border: 0; }
    .ib:hover { background: oklch(0.97 0.003 80); color: oklch(0.22 0.01 80); }
  </style>
</helmet>

<div style="width: 480px; height: 520px; background: oklch(0.985 0.003 90); padding: 30px; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="width: 420px; background: oklch(1 0 0); border: 1px solid oklch(0.91 0.004 80); border-radius: 10px; box-shadow: 0 1px 2px oklch(0 0 0 / 0.04), 0 1px 1px oklch(0 0 0 / 0.03); overflow: hidden; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px; border-bottom: 1px solid oklch(0.91 0.004 80);">
      <span style="font-size: 16px; font-weight: 700; color: oklch(0.22 0.01 80);">素材库</span>
      <span style="font-size: 12px; color: oklch(0.68 0.01 80);">· 0</span>
      <span style="flex-grow: 1;"></span>
      <button class="ib" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid oklch(0.95 0.003 80);">
      <button style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid oklch(0.91 0.004 80); background: oklch(1 0 0); color: oklch(0.32 0.01 80); font-size: 13px; font-weight: 500; font-family: inherit;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>上传
      </button>
      <button class="ib" aria-label="找参考素材"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6 -6"/><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464"/><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"/></svg></button>
      <button class="ib" aria-label="删除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg></button>
      <span style="width: 1px; height: 16px; background: oklch(0.91 0.004 80); margin: 0 4px;"></span>
      <button style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid oklch(0.91 0.004 80); background: oklch(1 0 0); color: oklch(0.32 0.01 80); font-size: 13px; font-family: inherit;">
        来源<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></svg>
      </button>
      <button class="ib" aria-label="筛选"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227z"/></svg></button>
      <div style="display: inline-flex; align-items: center; gap: 6px; flex-grow: 1; min-width: 0; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid oklch(0.91 0.004 80); background: oklch(1 0 0);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.01 80)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <span style="font-size: 13px; color: oklch(0.78 0.01 80);">搜索…</span>
      </div>
      <button class="ib" aria-label="新建文件夹"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h-7a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v3.5"/><path d="M16 19h6"/><path d="M19 16v6"/></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 36px 24px 28px; text-align: center;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.01 80)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8h.01"/><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z"/><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/></svg>
      <div style="font-size: 14px; font-weight: 500; color: oklch(0.22 0.01 80);">还没有素材</div>
      <div style="font-size: 12px; color: oklch(0.68 0.01 80); line-height: 1.6; max-width: 320px;">拖文件进来，或看看<span style="color: oklch(0.32 0.01 80); font-weight: 500;">抖音</span>同类目正在被收藏的片子长什么样</div>

      <div style="display: flex; align-items: center; gap: 6px; width: 300px; height: 34px; margin-top: 4px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; border: 1px solid oklch(0.55 0.13 250); background: oklch(1 0 0); box-shadow: 0 0 0 3px color-mix(in oklch, oklch(0.55 0.13 250) 10%, transparent);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.01 80)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <span style="font-size: 13px; color: oklch(0.78 0.01 80);">输产品词，或贴一条分享链接</span>
      </div>

      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: oklch(0.68 0.01 80);">
        <span>按回车搜索 · 每次约 $0.001 ·</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; color: oklch(0.32 0.01 80);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/></svg>
          抖音
        </span>
        <span style="color: oklch(0.55 0.13 250);">换平台</span>
      </div>
    </div>

  </div>

  <div style="margin-top: 16px; font-size: 12px; color: oklch(0.68 0.01 80); line-height: 1.7;">
    <b style="color: oklch(0.22 0.01 80); font-weight: 600;">卡点① 发现</b> —— 入口不是第 8 个按钮，是「贴链接」那颗的升级：<br>贴链接＝我已知道要哪条；输关键词＝我还不知道。<b style="color: oklch(0.32 0.01 80);">空态是天然教学位</b>，且素材库空时正是最需要它的时刻。
  </div>

</div>
</x-dc>
</body>
</html>
