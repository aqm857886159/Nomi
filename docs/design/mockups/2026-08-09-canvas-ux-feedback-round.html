<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomi · 画布体验反馈第 1 轮</title>
<style>
:root{
  --bg:oklch(.16 .008 80);--paper:oklch(.205 .008 80);--raised:oklch(.235 .009 80);
  --ink:oklch(.93 .008 80);--ink80:oklch(.82 .008 80);--ink60:oklch(.66 .008 80);
  --ink40:oklch(.50 .008 80);--ink30:oklch(.40 .008 80);--ink20:oklch(.30 .007 80);
  --ink10:oklch(.245 .006 80);--ink05:oklch(.215 .006 80);--line:oklch(.31 .008 80);
  --line-soft:oklch(.255 .006 80);--accent:oklch(.70 .13 250);
  --accent-soft:color-mix(in oklch,var(--accent) 16%,var(--paper));
  --danger:oklch(.72 .17 25);--danger-soft:color-mix(in oklch,var(--danger) 14%,var(--paper));
  --success:oklch(.76 .15 150);--sans:"Inter Variable",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Fraunces Variable",Fraunces,Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:6px;--r:10px;--r-lg:14px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.16);--shadow-md:0 10px 30px rgba(0,0,0,.24);
  --shadow-lg:0 18px 48px rgba(0,0,0,.34);--ease:140ms cubic-bezier(.2,.7,.3,1)
}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
button{font:inherit}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.review{min-height:100vh;display:flex;flex-direction:column}
.review-head{display:flex;align-items:center;gap:var(--s4);min-height:64px;padding:var(--s3) var(--s6);border-bottom:1px solid var(--line-soft);background:var(--paper)}
.brand{display:flex;align-items:center;gap:var(--s2);min-width:188px}.mark,.dotmark,.mini-mark{display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700}
.mark{width:26px;height:26px;border-radius:var(--r-sm);font-size:16px}.wordmark{font:18px var(--display)}.wordmark em{color:var(--accent);font-style:normal}
.head-copy{display:flex;flex-direction:column;min-width:0}.head-copy strong{font-size:14px;font-weight:600}.head-copy span{color:var(--ink60);font-size:11px}
.spacer{flex:1}.review-controls{display:flex;align-items:center;gap:var(--s2)}.control-label{color:var(--ink60);font-size:11px}
.segmented{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.segmented button{padding:5px 11px;border:0;border-radius:999px;color:var(--ink60);background:transparent;cursor:pointer}
.segmented button[aria-pressed=true]{color:var(--ink);background:var(--raised);box-shadow:var(--shadow-sm)}
.main{display:grid;grid-template-columns:224px minmax(680px,1fr);gap:var(--s5);padding:var(--s5) var(--s6) var(--s6);flex:1;min-height:0}
.nav{display:flex;flex-direction:column;gap:var(--s3);min-width:0}.kicker{color:var(--ink40);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.nav-list{display:flex;flex-direction:column;gap:var(--s1)}.nav-item{display:flex;align-items:center;gap:var(--s2);min-height:36px;padding:0 var(--s3);border:1px solid transparent;border-radius:var(--r);color:var(--ink60);background:transparent;text-align:left;cursor:pointer}
.nav-item:hover{color:var(--ink);background:var(--ink05)}.nav-item[aria-current=page]{color:var(--ink);border-color:color-mix(in oklch,var(--accent) 35%,var(--line));background:var(--accent-soft)}
.nav-item .glyph{width:18px;color:var(--ink40);font-size:13px}.nav-item[aria-current=page] .glyph{color:var(--accent)}
.nav-note{margin-top:auto;padding:var(--s3);border-top:1px solid var(--line-soft);color:var(--ink40);font-size:11px;line-height:1.7}.nav-note b{color:var(--ink80);font-weight:600}
.stage{min-width:0}.stage-meta{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);color:var(--ink60);font-size:11px}.stage-meta strong{color:var(--ink);font-weight:600}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.window{position:relative;display:flex;flex-direction:column;min-height:690px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg);box-shadow:var(--shadow-lg)}
.windowbar{display:flex;align-items:center;height:32px;padding:0 var(--s3);border-bottom:1px solid var(--line-soft);background:oklch(.13 .006 80);user-select:none}.window-brand{display:flex;align-items:center;gap:7px;color:var(--ink80);font-family:var(--display)}.mini-mark{width:16px;height:16px;border-radius:4px;font-size:10px}.window-drag{flex:1;height:100%}
.window-actions{display:flex;align-items:center;height:100%}.window-actions button{display:grid;place-items:center;width:38px;height:100%;border:0;color:var(--ink60);background:transparent;cursor:pointer}.window-actions button:hover{color:var(--ink);background:var(--ink10)}.window-actions .danger:hover{color:var(--bg);background:var(--danger)}
.windowbar.before .extra-browser{display:inline-flex;align-items:center;gap:5px;width:auto;padding:0 var(--s3);border:0;color:var(--ink60);background:transparent;font-size:12px}.windowbar.after .extra-browser{display:none}
.appbar{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:0 var(--s4);border-bottom:1px solid var(--line);background:var(--paper)}.app-brand{display:flex;align-items:center;gap:var(--s2);color:var(--ink);white-space:nowrap}.dotmark{width:22px;height:22px;border-radius:6px;font-size:13px}.crumb{color:var(--ink60);font-size:12px;white-space:nowrap}.crumb b{color:var(--ink80);font-weight:500}
.appbar .spacer{flex:1}.stepper{display:flex;gap:2px;padding:2px;border:1px solid var(--line-soft);border-radius:999px;background:var(--bg)}.stepper span{padding:4px 10px;border-radius:999px;color:var(--ink40);font-size:11px}.stepper span.active{color:var(--ink);background:var(--raised)}
.app-actions{display:flex;align-items:center;gap:var(--s1)}.app-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 9px;border:1px solid transparent;border-radius:var(--r-sm);color:var(--ink60);background:transparent;cursor:pointer;white-space:nowrap}.app-button:hover{color:var(--ink);background:var(--ink05)}.app-button.primary{color:var(--bg);background:var(--ink)}.app-button.primary:hover{background:var(--accent)}.app-button.selected{color:var(--accent);border-color:color-mix(in oklch,var(--accent) 35%,var(--line));background:var(--accent-soft)}.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;color:var(--bg);background:var(--accent);font-size:10px}.app-divider{width:1px;height:20px;margin:0 var(--s1);background:var(--line-soft)}
.canvas{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle,color-mix(in oklch,var(--ink) 17%,transparent) 1px,transparent 1px);background-size:24px 24px}.canvas:after{content:"生成 · 体验走查";position:absolute;right:var(--s4);bottom:var(--s3);color:var(--ink30);font-size:10px;letter-spacing:.08em}.canvas-empty{display:grid;place-items:center;align-content:center;gap:var(--s2);height:100%;color:var(--ink40)}
.node{position:absolute;left:50%;top:53%;width:286px;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:var(--r);overflow:visible;background:var(--paper);box-shadow:var(--shadow-md)}.node.video{width:360px}.node-head{display:flex;align-items:center;gap:var(--s2);min-height:34px;padding:0 var(--s3);border-bottom:1px solid var(--line-soft);color:var(--ink80);font-size:11px}.kind{color:var(--accent);font-size:10px;letter-spacing:.08em}.node-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media{position:relative;height:176px;overflow:hidden;background:linear-gradient(135deg,oklch(.32 .04 155),oklch(.19 .03 210))}.media:before{content:"";position:absolute;left:18%;bottom:16%;width:64%;height:38%;border-radius:50% 50% 4% 4%;background:color-mix(in oklch,var(--accent) 55%,transparent);opacity:.65}.media:after{content:"NOMI / sample";position:absolute;left:var(--s3);bottom:var(--s2);color:color-mix(in oklch,var(--ink) 75%,transparent);font:9px var(--mono)}.video-media{height:196px;background:linear-gradient(135deg,oklch(.27 .06 150),oklch(.15 .025 210))}.video-media:before{left:11%;bottom:15%;width:78%;height:34%;background:color-mix(in oklch,oklch(.78 .12 85) 60%,transparent)}.play{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);font-size:32px;opacity:.78}
.node-foot{display:flex;align-items:center;gap:var(--s2);min-height:36px;padding:0 var(--s3);border-top:1px solid var(--line-soft);color:var(--ink60);font-size:11px}.model{color:var(--ink80)}.node-foot .spacer{flex:1}.run{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;color:var(--bg);background:var(--ink)}.node.selected{outline:1px solid var(--accent);outline-offset:3px}
.toolbar{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;min-height:42px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--raised);box-shadow:var(--shadow-md);white-space:nowrap;z-index:5}.toolbar.before{gap:1px}.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 10px;border:0;border-radius:var(--r-sm);color:var(--ink80);background:transparent;cursor:pointer;white-space:nowrap}.tool:hover,.tool[aria-expanded=true]{color:var(--ink);background:var(--ink10)}.tool.accent{color:var(--accent);font-weight:600}.tool i{font-size:16px}.tool.icon{width:32px;padding:0}.divide{width:1px;height:20px;margin:0 3px;background:var(--line)}.group-label{margin:0 2px 0 5px;color:var(--ink40);font-size:9px;letter-spacing:.06em}
.menu{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);min-width:194px;padding:5px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-lg);z-index:20}.menu-group{padding:5px 8px 3px;color:var(--ink40);font-size:10px;letter-spacing:.06em}.menu-item{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:0 8px;border:0;border-radius:var(--r-sm);color:var(--ink80);background:transparent;text-align:left;cursor:pointer}.menu-item:hover{color:var(--ink);background:var(--ink05)}.menu-item i{width:17px;color:var(--ink60);font-size:15px}
.task-panel{position:absolute;right:16px;width:330px;max-height:410px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--shadow-lg);z-index:50}.task-panel.before{top:56px}.task-panel.after{top:92px}.task-head{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-bottom:1px solid var(--line)}.task-head strong{font-size:14px;font-weight:600}.task-head span{flex:1}.task-head button{border:0;color:var(--ink60);background:transparent;cursor:pointer;font-size:18px}.summary{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--ink80);background:var(--ink05)}.section{padding:9px 14px 4px;color:var(--ink60);font-size:10px;letter-spacing:.06em}.task-row{padding:9px 14px;border-bottom:1px solid var(--line-soft)}.task-row strong{display:block;color:var(--ink);font-size:13px;font-weight:500}.task-row small{display:block;margin-top:3px;color:var(--ink60);font-size:11px}.task-row .locked{color:var(--ink40)}.task-foot{padding:12px 14px;color:var(--ink40);font-size:11px}
.toast-stack{position:absolute;top:100px;right:16px;display:flex;flex-direction:column;gap:var(--s2);width:330px;z-index:60}.toast{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0 10px;border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:var(--r);background:var(--raised);box-shadow:var(--shadow-lg)}.toast.success{border-left-color:var(--success)}.toast-copy{flex:1;min-width:0}.toast strong{display:block;color:var(--ink);font-size:12px;font-weight:500}.toast small{display:block;color:var(--ink60);font-size:10px}.toast button{border:0;color:var(--accent);background:transparent;cursor:pointer;font-size:11px}.toast .close{color:var(--ink40);font-size:16px}
.prov-backdrop{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.42);z-index:70}.prov{width:min(520px,100%);max-height:80%;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--shadow-lg)}.prov-head{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:12px;align-items:start;padding:16px 18px 13px;border-bottom:1px solid var(--line)}.prov-head h2{margin:0;color:var(--ink);font-size:16px;font-weight:600}.prov-name{min-width:0;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink40);font:10px var(--mono)}.prov-close{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:var(--r-sm);color:var(--ink60);background:transparent;cursor:pointer;font-size:18px}.prov-close:hover{color:var(--ink);background:var(--ink05)}.prov-body{padding:16px 18px 20px;color:var(--ink60);font-size:12px}.prov-body p{margin:0 0 12px}.prov-body .muted{color:var(--ink40)}.prov-body ul{margin:6px 0 0;padding-left:20px}
.annotation{display:flex;align-items:flex-start;gap:8px;min-height:44px;margin-top:var(--s3);padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--paper);color:var(--ink60);font-size:11px;line-height:1.65}.annotation b{color:var(--ink);font-weight:600}.priority{flex:none;padding:2px 6px;border-radius:999px;color:var(--bg);background:var(--danger);font-size:10px}.annotation.p1 .priority{background:var(--accent)}
.glyph{display:inline-grid;place-items:center;min-width:16px;height:16px;font-family:var(--sans);font-size:14px;line-height:1;text-align:center}
.mode-before .after,.mode-after .before{display:none!important}
body.mode-before .mode-only-after{display:none!important}body.mode-after .mode-only-before{display:none!important}
@media(max-width:1080px){.main{grid-template-columns:1fr}.nav{flex-direction:row;align-items:center;overflow:auto}.kicker,.nav-note{display:none}.nav-list{flex-direction:row;min-width:max-content}.window{min-height:620px}}
@media(max-width:720px){.review-head{flex-wrap:wrap;padding:var(--s3) var(--s4)}.brand{min-width:auto}.head-copy{order:3;width:100%}.review-controls{margin-left:auto}.main{padding:var(--s4)}.appbar{gap:var(--s2);padding:0 var(--s3)}.crumb,.stepper{display:none}.text-action{display:none}.toolbar{max-width:calc(100% - 16px);overflow-x:auto}.task-panel{right:8px;left:8px;width:auto}}
</style>
</head>
<body class="mode-after">
<main class="review">
  <header class="review-head">
    <div class="brand"><span class="mark">N</span><span class="wordmark">No<em>m</em>i</span></div>
    <div class="head-copy"><strong>画布体验反馈 · 第 1 轮</strong><span>来自 2026-08-08 自聊截图的可交互样张</span></div>
    <div class="spacer"></div>
    <div class="review-controls"><span class="control-label">对照</span><div class="segmented" role="group" aria-label="现状和改后"><button data-mode="before" aria-pressed="false">现状</button><button data-mode="after" aria-pressed="true">改后</button></div></div>
  </header>
  <div class="main">
    <aside class="nav">
      <div class="kicker">场景</div>
      <div class="nav-list">
        <button class="nav-item" aria-current="page" data-scene="windows"><span class="glyph">□</span>Windows 顶栏</button>
        <button class="nav-item" data-scene="image"><span class="glyph">▧</span>图片工具栏</button>
        <button class="nav-item" data-scene="video"><span class="glyph">▷</span>视频工具栏</button>
        <button class="nav-item" data-scene="toast"><span class="glyph">!</span>抠图失败</button>
        <button class="nav-item" data-scene="provenance"><span class="glyph">≡</span>生成记录</button>
      </div>
      <div class="nav-note"><b>怎么体验</b><br>切换“现状 / 改后”，再点击任务、更多、取画面、模拟失败或生成记录，感受入口、位置和状态的变化。</div>
    </aside>
    <section class="stage">
      <div class="stage-meta"><span class="status-dot"></span><strong id="scene-title">Windows 顶栏</strong><span id="scene-meta">窗口层与产品层拆开，任务面板跟随按钮</span></div>
      <div class="window" id="window"></div>
      <div class="annotation" id="annotation"></div>
    </section>
  </div>
</main>
<script>
const state={mode:"after",scene:"windows",task:false,imageMenu:false,videoMenu:false,toast:false,toastSuccess:false,prov:false};
const copy={
  windows:["Windows 顶栏","窗口层与产品层拆开，任务面板跟随按钮","P0","<b>现象：</b>浏览器按钮落在 Windows 自绘栏，固定偏移的任务面板盖住 AppBar。<br><b>改后：</b>窗口栏只做窗口；任务面板从任务按钮底部 8px 处展开。"],
  image:["图片工具栏","常驻保留高频动作，长尾动作共享一个入口","P1","<b>现象：</b>定妆、AI 编辑、裁剪、抠图、切图、变换、画板和三个图标动作挤在一条线。<br><b>改后：</b>“建参考图”说明结果；切图、变换、画板放入同一个“更多”菜单，不增加它们原本的菜单层级。"],
  video:["视频工具栏","三个同类动作收为“取画面”菜单","P1","<b>现象：</b>首帧、尾帧、按镜头拆横向平铺，读起来像三个不同体系。<br><b>改后：</b>统一为“取画面 ▾”，菜单内保留三个明确动作。"],
  toast:["抠图失败","稳定 ID 去重，通知只承担一条明确的下一步","P0","<b>现象：</b>同一失败 Toast 连发三条，遮挡顶栏和画布。<br><b>改后：</b>同节点同动作复用稳定 ID，只更新一条通知，并提供“重试”。"],
  provenance:["生成记录","固定标题，长节点名退到次级单行区域","P1","<b>现象：</b>长节点名和“生成记录”共用标题行，关闭按钮被挤到标题中间。<br><b>改后：</b>标题、节点名、关闭动作各有自己的网格位置。"]
};
const glyphs={browser:"▣",progress:"◌",minus:"−",square:"□",x:"×",settings:"⚙","plug-connected":"⌁","arrow-right":"→",wand:"✦",sparkles:"✦",crop:"⌗",scissors:"✂","grid-dots":"⊞",transform:"↻",brush:"✎",maximize:"⛶",download:"↓","info-circle":"ⓘ","photo-plus":"+",dots:"···","layout-grid":"▦","grid-3x3":"▦","rotate-clockwise-2":"↻","player-track-prev":"◀|","player-track-next":"|▶",cut:"✂",movie:"▤",lock:"▣",click:"·"};
const I=n=>'<span class="glyph" aria-hidden="true">'+(glyphs[n]||"·")+'</span>';
function windowBar(){return '<div class="windowbar '+state.mode+'"><div class="window-brand"><span class="mini-mark">N</span>Nomi</div><div class="window-drag"></div>'+(state.mode==="before"?'<button class="extra-browser">'+I("browser")+'浏览器</button>':"")+'<div class="window-actions"><button aria-label="最小化">'+I("minus")+'</button><button aria-label="最大化">'+I("square")+'</button><button class="danger" aria-label="关闭">'+I("x")+'</button></div></div>'}
function appBar(){return '<div class="appbar"><div class="app-brand"><span class="dotmark">N</span>Nomi</div><div class="crumb">项目库　›　<b>星尘旅人</b></div><div class="spacer"></div><div class="stepper"><span>创作</span><span class="active">生成</span><span>预览</span></div><div class="spacer"></div><div class="app-actions"><button class="app-button '+(state.task?"selected":"")+'" data-action="task" aria-expanded="'+state.task+'">'+I("progress")+'<span class="text-action">任务</span><span class="badge">1</span></button>'+(state.mode==="after"?'<div class="app-divider"></div><button class="app-button">'+I("browser")+'<span class="text-action">浏览器</span></button>':"")+'<button class="app-button">'+I("settings")+'<span class="text-action">设置</span></button><button class="app-button">'+I("plug-connected")+'<span class="text-action">模型接入</span></button><button class="app-button primary">'+I("arrow-right")+'<span class="text-action">去出片</span></button></div></div>'}
function toolbarImage(){if(state.mode==="before")return '<div class="toolbar before"><button class="tool accent">'+I("sparkles")+'定妆</button><button class="tool">'+I("wand")+'AI 编辑⌄</button><span class="divide"></span><button class="tool">'+I("crop")+'裁剪</button><button class="tool" data-action="show-toast">'+I("scissors")+'抠图</button><button class="tool">'+I("grid-dots")+'切图⌄</button><button class="tool">'+I("transform")+'变换⌄</button><span class="divide"></span><button class="tool">'+I("brush")+'画板</button><span class="divide"></span><button class="tool icon" title="全屏预览">'+I("maximize")+'</button><button class="tool">'+I("download")+'下载</button><button class="tool icon" data-action="prov" title="生成记录">'+I("info-circle")+'</button></div>';return '<div class="toolbar"><button class="tool accent" title="以这张图为基础，新建角色或场景参考节点">'+I("photo-plus")+'建参考图</button><button class="tool">'+I("wand")+'AI 编辑⌄</button><span class="divide"></span><span class="group-label">改这张</span><button class="tool">'+I("crop")+'裁剪</button><button class="tool" data-action="show-toast">'+I("scissors")+'抠图</button><button class="tool" data-action="image-menu" aria-expanded="'+state.imageMenu+'">'+I("dots")+'更多⌄</button>'+(state.imageMenu?'<div class="menu"><div class="menu-group">拆分与变换</div><button class="menu-item">'+I("layout-grid")+'切图 · 四视图</button><button class="menu-item">'+I("grid-3x3")+'切图 · 九宫格</button><button class="menu-item">'+I("rotate-clockwise-2")+'旋转与翻转</button><div class="menu-group">交接</div><button class="menu-item">'+I("brush")+'在画板中打开</button></div>':"")+'<span class="divide"></span><button class="tool icon" title="全屏预览">'+I("maximize")+'</button><button class="tool icon" title="下载">'+I("download")+'</button><button class="tool icon" data-action="prov" title="生成记录">'+I("info-circle")+'</button></div>'}
function toolbarVideo(){if(state.mode==="before")return '<div class="toolbar before"><button class="tool">'+I("player-track-prev")+'抽首帧</button><button class="tool">'+I("player-track-next")+'抽尾帧</button><button class="tool">'+I("cut")+'按镜头拆</button><span class="divide"></span><button class="tool icon" title="全屏预览">'+I("maximize")+'</button><button class="tool">'+I("download")+'下载</button><button class="tool icon" data-action="prov" title="生成记录">'+I("info-circle")+'</button></div>';return '<div class="toolbar"><button class="tool" data-action="video-menu" aria-expanded="'+state.videoMenu+'">'+I("movie")+'取画面⌄</button>'+(state.videoMenu?'<div class="menu"><div class="menu-group">从这段视频取出</div><button class="menu-item">'+I("player-track-prev")+'提取首帧</button><button class="menu-item">'+I("player-track-next")+'提取尾帧</button><button class="menu-item">'+I("cut")+'按镜头拆分</button></div>':"")+'<span class="divide"></span><button class="tool icon" title="全屏预览">'+I("maximize")+'</button><button class="tool icon" title="下载">'+I("download")+'</button><button class="tool icon" data-action="prov" title="生成记录">'+I("info-circle")+'</button></div>'}
function taskPanel(){if(!state.task)return "";return '<div class="task-panel '+state.mode+'"><div class="task-head">'+I("progress")+'<strong>任务</strong><span></span><button data-action="task" aria-label="关闭">×</button></div>'+(state.mode==="before"?'<div class="summary">1 进行中</div>':"")+'<div class="section">进行中 · 1</div><div class="task-row"><strong>图片</strong><small>正在生成，已等 13 秒 · 已跑 0:15</small><small class="locked">'+I("lock")+' 已提交厂商，无法中止（费用已产生）</small></div><div class="task-foot">跑完提示我 <span style="float:right;color:var(--accent)">声音　系统通知</span></div></div>'}
function toastStack(){if(state.scene!=="toast")return "";if(state.mode==="before")return '<div class="toast-stack"><div class="toast"><div class="toast-copy"><strong>抠图失败，请检查网络连接后重试</strong><small>remove-background:node-25</small></div><button class="close">×</button></div><div class="toast"><div class="toast-copy"><strong>抠图失败，请检查网络连接后重试</strong><small>remove-background:node-25</small></div><button class="close">×</button></div><div class="toast"><div class="toast-copy"><strong>抠图失败，请检查网络连接后重试</strong><small>remove-background:node-25</small></div><button class="close">×</button></div></div>';if(!state.toast)return "";return '<div class="toast-stack"><div class="toast '+(state.toastSuccess?"success":"")+'"><div class="toast-copy"><strong>'+(state.toastSuccess?"已重新提交抠图":"抠图资源加载失败")+'</strong><small>'+(state.toastSuccess?"正在重试，不会重复创建通知":"请检查网络或本地资源后重试")+'</small></div>'+(state.toastSuccess?"":'<button data-action="retry">重试</button>')+'<button class="close" data-action="dismiss">×</button></div></div>'}
function prov(){if(!state.prov)return "";const n="3D-gen-v2-scene3d-msiq86jf-cc12-1786093984602";if(state.mode==="before")return '<div class="prov-backdrop"><div class="prov"><div class="prov-head"><h2>生成记录 · '+n+'</h2><button class="prov-close" data-action="close-prov">×</button></div><div class="prov-body"><p>该节点没有可追溯的生成记录。</p><p class="muted">可能原因：</p><ul><li>节点来自 v0.4.0 之前的旧项目</li><li>素材为本地导入，非 AI 生成</li><li>生成调用失败，未写入生成记录</li></ul></div></div></div>';return '<div class="prov-backdrop"><div class="prov"><div class="prov-head"><div><h2>生成记录</h2><div class="prov-name" title="'+n+'">'+n+'</div></div><button class="prov-close" data-action="close-prov">×</button></div><div class="prov-body"><p>该节点没有可追溯的生成记录。</p><p class="muted">可能原因：</p><ul><li>节点来自 v0.4.0 之前的旧项目</li><li>素材为本地导入，非 AI 生成</li><li>生成调用失败，未写入生成记录</li></ul></div></div></div>'}
function canvas(){
  if(state.scene==="image")return '<div class="canvas"><div class="node selected"><div class="node-head"><span class="kind">IMAGE</span><span class="node-name">角色参考 · 主人公</span></div><div class="media"></div><div class="node-foot"><span class="model">GPT Image 2</span><span>图生图</span><span class="spacer"></span><span class="run">↗</span></div>'+toolbarImage()+'</div></div>';
  if(state.scene==="video")return '<div class="canvas"><div class="node video selected"><div class="node-head"><span class="kind">VIDEO</span><span class="node-name">镜头 04 · 草原上的回望</span></div><div class="media video-media"><span class="play">▶</span></div><div class="node-foot"><span class="model">Seedance</span><span>6 秒 · 16:9</span><span class="spacer"></span><span class="run">↗</span></div>'+toolbarVideo()+'</div></div>';
  if(state.scene==="provenance")return '<div class="canvas"><div class="node selected"><div class="node-head"><span class="kind">3D</span><span class="node-name">3D-gen-v2-scene3d-msiq86jf-cc12-1786093984602</span></div><div class="media"></div><div class="node-foot"><span class="model">Scene 3D</span><span class="spacer"></span><button class="tool" data-action="prov">'+I("info-circle")+'查看生成记录</button></div></div></div>';
  return '<div class="canvas"><div class="canvas-empty">'+I("click")+'<span>选择左侧场景，体验改动前后</span></div></div>';
}
function render(){const c=copy[state.scene];document.body.className="mode-"+state.mode;document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===state.mode)));document.querySelectorAll("[data-scene]").forEach(b=>b.setAttribute("aria-current",b.dataset.scene===state.scene?"page":"false"));document.getElementById("scene-title").textContent=c[0];document.getElementById("scene-meta").textContent=c[1];document.getElementById("annotation").innerHTML='<span class="priority">'+c[2]+'</span><div>'+c[3]+'</div>';document.getElementById("annotation").className="annotation "+(c[2]==="P1"?"p1":"");document.getElementById("window").innerHTML=windowBar()+appBar()+canvas()+taskPanel()+toastStack()+prov()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-mode],[data-scene],[data-action]");if(!t)return;if(t.dataset.mode){state.mode=t.dataset.mode;state.task=false;state.imageMenu=false;state.videoMenu=false;render();return}if(t.dataset.scene){state.scene=t.dataset.scene;state.task=false;state.imageMenu=false;state.videoMenu=false;state.toast=state.scene==="toast"&&state.mode==="after";state.toastSuccess=false;state.prov=false;render();return}const a=t.dataset.action;if(a==="task"){state.task=!state.task;render()}else if(a==="image-menu"){state.imageMenu=!state.imageMenu;state.videoMenu=false;render()}else if(a==="video-menu"){state.videoMenu=!state.videoMenu;state.imageMenu=false;render()}else if(a==="show-toast"){state.scene="toast";state.mode="after";state.toast=true;state.toastSuccess=false;render()}else if(a==="dismiss"){state.toast=false;render()}else if(a==="retry"){state.toast=true;state.toastSuccess=true;render()}else if(a==="prov"){state.prov=true;state.task=false;render()}else if(a==="close-prov"){state.prov=false;render()}});document.addEventListener("keydown",e=>{if(e.key==="Escape"){state.task=false;state.imageMenu=false;state.videoMenu=false;state.prov=false;render()}});render();
</script>
