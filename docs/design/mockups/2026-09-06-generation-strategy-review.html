<!doctype html>
<html lang="zh-CN" data-mantine-color-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generation Strategy Review · 执行计划审阅样张（nomi token）</title>
<style>
  /* Nomi design tokens（运行时真源 tailwind.config.ts addBase；本块镜像 nomi-tokens.css 供样张独立运行） */
  :root {
    --nomi-bg: oklch(0.985 0.003 90);
    --nomi-paper: oklch(1 0 0);
    --nomi-ink: oklch(0.22 0.01 80);
    --nomi-ink-80: oklch(0.32 0.01 80);
    --nomi-ink-60: oklch(0.50 0.01 80);
    --nomi-ink-40: oklch(0.68 0.01 80);
    --nomi-ink-30: oklch(0.78 0.01 80);
    --nomi-ink-20: oklch(0.88 0.005 80);
    --nomi-ink-10: oklch(0.94 0.003 80);
    --nomi-ink-05: oklch(0.97 0.003 80);
    --nomi-line: oklch(0.91 0.004 80);
    --nomi-line-soft: oklch(0.95 0.003 80);
    --nomi-accent: oklch(0.55 0.13 250);
    --nomi-accent-soft: color-mix(in srgb, var(--nomi-accent) 12%, var(--nomi-paper));
    --nomi-danger: oklch(0.55 0.20 27);
    --nomi-warning: oklch(0.62 0.14 75);
    --nomi-track-video: oklch(0.65 0.13 150);
    --nomi-track-image: oklch(0.7 0.13 200);
    --nomi-radius-sm: 6px;
    --nomi-radius: 10px;
    --nomi-radius-lg: 16px;
    --nomi-shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04), 0 1px 1px oklch(0 0 0 / 0.03);
    --nomi-transition-fast: 140ms cubic-bezier(.2, .7, .3, 1);
    --nomi-font-sans: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    /* 语义派生（仅样张本地：真实组件里是 token-only，不在 JSX/内联直写颜色） */
    --teal-soft: color-mix(in srgb, var(--nomi-track-video) 14%, var(--nomi-paper));
    --amber-soft: color-mix(in srgb, var(--nomi-warning) 16%, var(--nomi-paper));
    --red-soft: color-mix(in srgb, var(--nomi-danger) 12%, var(--nomi-paper));
  }
  :root[data-mantine-color-scheme="dark"] {
    color-scheme: dark;
    --nomi-bg: oklch(0.18 0.006 80);
    --nomi-paper: oklch(0.235 0.007 80);
    --nomi-ink: oklch(0.93 0.006 85);
    --nomi-ink-80: oklch(0.84 0.006 85);
    --nomi-ink-60: oklch(0.70 0.006 85);
    --nomi-ink-40: oklch(0.62 0.006 85);
    --nomi-ink-30: oklch(0.50 0.006 85);
    --nomi-ink-20: oklch(0.42 0.006 85);
    --nomi-ink-10: oklch(0.34 0.006 85);
    --nomi-ink-05: oklch(0.30 0.006 85);
    --nomi-line: oklch(0.36 0.007 80);
    --nomi-line-soft: oklch(0.31 0.007 80);
    --nomi-accent: oklch(0.70 0.13 250);
    --nomi-accent-soft: color-mix(in srgb, var(--nomi-accent) 26%, var(--nomi-paper));
    --nomi-danger: oklch(0.72 0.16 25);
    --nomi-warning: oklch(0.78 0.13 75);
    --nomi-track-video: oklch(0.70 0.13 150);
    --nomi-track-image: oklch(0.72 0.13 200);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nomi-bg); color: var(--nomi-ink); font-family: var(--nomi-font-sans); font-size: 13px; line-height: 1.5; padding: 24px; }
  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .kicker { color: var(--nomi-ink-40); font-size: 12px; }
  h1 { font-size: 16px; font-weight: 500; margin: 2px 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 500; margin: 0; color: var(--nomi-ink-80); }
  button { font: inherit; border: 0; border-radius: var(--nomi-radius-sm); cursor: pointer; }
  .btn { padding: 7px 12px; background: var(--nomi-paper); border: 1px solid var(--nomi-line); color: var(--nomi-ink); border-radius: var(--nomi-radius-sm); }
  .btn-primary { background: var(--nomi-accent); border-color: var(--nomi-accent); color: var(--nomi-paper); }
  .btn-ghost { background: transparent; border: 1px solid var(--nomi-line); color: var(--nomi-ink-60); }
  .card { background: var(--nomi-paper); border: 1px solid var(--nomi-line); border-radius: var(--nomi-radius); padding: 14px 16px; }
  .verdict { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--nomi-line); background: var(--nomi-ink-05); color: var(--nomi-ink-60); }
  .chip.teal { background: var(--teal-soft); border-color: var(--nomi-track-video); color: var(--nomi-ink-80); }
  .chip.amber { background: var(--amber-soft); border-color: var(--nomi-warning); color: var(--nomi-ink-80); }
  .chip.blue { background: var(--nomi-accent-soft); border-color: var(--nomi-accent); color: var(--nomi-ink-80); }
  .shot { background: var(--nomi-bg); border: 1px solid var(--nomi-line-soft); border-radius: var(--nomi-radius-sm); padding: 10px 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: start; }
  .shot + .shot { margin-top: 8px; }
  .shot.no { color: var(--nomi-ink-40); font-size: 12px; padding-top: 3px; }
  .shot .title { font-weight: 500; }
  .shot .sub { color: var(--nomi-ink-40); font-size: 12px; margin-top: 2px; }
  .meta { font-size: 12px; color: var(--nomi-ink-60); display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--nomi-line); background: var(--nomi-paper); color: var(--nomi-ink-60); white-space: nowrap; }
  .pill.clamp { color: var(--nomi-ink-80); background: var(--amber-soft); border-color: var(--nomi-warning); }
  .merge { border-color: var(--nomi-track-video); background: var(--teal-soft); }
  .merge .title { color: var(--nomi-ink); }
  .groupbar { font-size: 12px; color: var(--nomi-ink-80); margin: 6px 0 2px; }
  .issue { font-size: 12px; color: var(--nomi-ink-80); background: var(--amber-soft); border: 1px solid var(--nomi-warning); border-radius: var(--nomi-radius-sm); padding: 7px 10px; margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
  .issue.red { color: var(--nomi-ink-80); background: var(--red-soft); border-color: var(--nomi-danger); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; align-items: center; }
  .note { color: var(--nomi-ink-40); font-size: 12px; margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; }
  .adopt { border: 1px solid var(--nomi-track-video); background: transparent; color: var(--nomi-ink-80); padding: 4px 12px; font-size: 12px; border-radius: 999px; }
  .adopt.on { background: var(--nomi-track-video); border-color: var(--nomi-track-video); color: var(--nomi-paper); }
  .expand { border: 0; background: transparent; color: var(--nomi-ink-40); font-size: 12px; padding: 4px 6px; }
  .detail { display: none; margin-top: 8px; padding: 8px 10px; background: var(--nomi-ink-05); border-radius: var(--nomi-radius-sm); font-size: 12px; color: var(--nomi-ink-60); border: 1px dashed var(--nomi-line); }
  .detail.open { display: block; }
  .toggle { font-size: 12px; color: var(--nomi-ink-60); background: transparent; border: 1px solid var(--nomi-line); padding: 4px 10px; border-radius: 999px; }
  .footer { color: var(--nomi-ink-40); font-size: 12px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div>
      <div class="kicker">方案审阅 · propose_storyboard_plan</div>
      <h1>Rainy Night Chase · 5 Shots</h1>
    </div>
    <button class="toggle" id="themeBtn" type="button">切换暗色</button>
  </div>

  <div class="card">
    <h2>执行计划 · Generation Strategy</h2>
    <div class="verdict" id="verdict">
      <span class="chip teal" id="chipMerge">1 条合并建议</span>
      <span class="chip amber" id="chipFix">2 项需修正</span>
      <span class="chip blue">模型统一：MiniMax H3（参考生视频）</span>
    </div>
    <p class="kicker" style="margin:10px 0 0">机器按模型真实上限裁决时长/参数与合并；采纳或展开后仍可逐镜改。落画布前会再校验一次。</p>
  </div>

  <div class="card">
    <h2>分镜 + 建议</h2>
    <div id="list"></div>
    <div class="actions">
      <button class="btn-ghost btn" id="adoptAll" type="button">全部采纳建议</button>
      <button class="btn btn-primary" type="button">按当前方案落画布</button>
    </div>
    <div class="note">落画布前系统会再跑一次 resolve：任何超上限/未知参数/低于下限的镜头会被拦下并提示修正（fail-closed）。</div>
  </div>
  <div class="footer">Nomi · 方案免费可改，执行才花钱 —— 逐项审阅后确认</div>
</div>

<script>
  const adoptAll = document.getElementById("adoptAll");
  const adoptStates = {};
  const setAdopt = (id, on) => {
    adoptStates[id] = on;
    const btn = document.getElementById(id);
    if (btn) { btn.classList.toggle("on", on); btn.textContent = on ? "已采纳" : "采纳"; }
    const wrap = document.getElementById(id + "-wrap");
    if (wrap) wrap.classList.toggle("merge", on);
    const chip = document.getElementById("chipMerge");
    const pending = Object.values(adoptStates).filter((v) => !v).length;
    chip.textContent = pending ? pending + " 条合并建议" : "已全部采纳合并";
    adoptAll.textContent = Object.values(adoptStates).every(Boolean) ? "已全部采纳" : "全部采纳建议";
  };
  adoptAll.addEventListener("click", () => {
    const keys = Object.keys(adoptStates);
    const allOn = keys.length > 0 && keys.every((k) => adoptStates[k]);
    keys.forEach((id) => setAdopt(id, !allOn));
  });
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".adopt"); if (btn) setAdopt(btn.dataset.id, !adoptStates[btn.dataset.id]);
    const ex = e.target.closest(".expand"); if (ex) { const target = document.getElementById(ex.dataset.target); target.classList.toggle("open"); ex.textContent = target.classList.contains("open") ? "收起" : "展开原镜"; }
  });
  document.getElementById("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const next = root.dataset.mantineColorScheme === "light" ? "dark" : "light";
    root.dataset.mantineColorScheme = next;
    document.getElementById("themeBtn").textContent = next === "dark" ? "切换亮色" : "切换暗色";
  });

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const data = [
    { kind: "merge", id: "m1", ids: ["s1", "s2"], label: "镜头 1+2 合并 · 10s", dur: "6s+4s", accepted: "10s", reason: "同场同角色短拍，合计 10s ≤ MiniMax H3 上限 15s —— 并入一次生成，动作与光线更连续、少一次抽卡。", chips: ["参考图锁角色", "同场"] },
    { kind: "single", no: "S1", label: "镜头 1｜暴雨夜的便利店门口", dur: "6s", meta: "同场：巷口雨夜" },
    { kind: "single", no: "S2", label: "镜头 2｜他抬头，雨水顺着帽檐滴", dur: "4s", meta: "同场：巷口雨夜" },
    { kind: "single", no: "S3", label: "镜头 3｜他摸出打火机，点燃", dur: "8s", meta: "同场：巷口雨夜 · 中等拍", note: "8s > 上限一半，不并入（避免把两个完整拍塞进一条）" },
    { kind: "underflow", no: "S4", label: "镜头 4｜雷声，他顿住", dur: "2s", meta: "低于 4s 下限，无法单独生成", issue: "时长 2s 低于下限 4s —— 已并入邻镜 5（合计 6s）", accepted: "并入镜头 5 → 6s" },
    { kind: "single", no: "S5", label: "镜头 5｜转身冲进雨里（并入镜头 4 后）", dur: "4s+2s", accepted: "6s", meta: "同场：巷口雨夜" },
    { kind: "split", no: "S6", label: "镜头 6｜追车长镜：横摇跟到车尾灯消失", dur: "40s", meta: "超单条上限", issue: "40s 超过单条上限 15s —— 拆成 3 条连续生成，同锚复用 + 段间首尾帧承接。", accepted: "15+15+10", split: "15s · 15s · 10s" },
  ];

  const pill = (text, cls) => '<span class="pill ' + (cls || "") + '">' + esc(text) + "</span>";
  const renderShot = (g) => {
    const wrap = document.createElement("div");
    wrap.id = (g.id || g.no) + "-wrap";
    wrap.className = "shot" + (g.kind === "merge" ? " merge" : "");
    const left = '<div class="no">' + (g.kind === "merge" ? g.ids.map((id) => id.toUpperCase()).join("+") : g.no) + "</div>";
    let body = "<div><div class='row1'><span class='title'>" + esc(g.label) + "</span>" +
      (g.kind === "merge" ? g.chips.map((c) => pill(c, "teal")).join("") : "") +
      (g.accepted && g.accepted !== g.dur ? pill(g.dur + " → " + g.accepted, g.kind === "split" || g.kind === "underflow" ? "clamp" : "") : "") + "</div>";
    if (g.kind === "merge") {
      body += '<div class="groupbar">' + esc(g.reason) + "</div>";
      body += '<button class="expand" data-target="' + g.id + '-d" type="button">展开原镜</button>';
      body += '<div class="detail" id="' + g.id + '-d">不采纳则按两镜分别生成；采纳后两镜保留在方案里可继续逐镜编辑。</div>';
    } else {
      body += '<div class="sub">' + esc(g.meta || "") + "</div>";
      if (g.note) body += '<div class="sub">' + esc(g.note) + "</div>";
      if (g.issue) body += '<div class="issue' + (g.kind === "split" ? " red" : "") + '">' + esc(g.issue) + "</div>";
      if (g.split) body += '<div class="detail open" style="display:block">拆条分配：' + esc(g.split) + "</div>";
    }
    body += "</div>";
    const right = g.kind === "merge"
      ? '<div class="meta"><button class="adopt" data-id="' + g.id + '" id="' + g.id + '" type="button">采纳</button></div>'
      : (g.accepted ? '<div class="meta">' + pill(g.accepted, g.kind === "split" || g.kind === "underflow" ? "clamp" : "") + "</div>" : "");
    wrap.innerHTML = left + body + right;
    if (g.kind === "merge") adoptStates[g.id] = false;
    return wrap;
  };
  const list = document.getElementById("list");
  data.forEach((g) => list.appendChild(renderShot(g)));
  setAdopt("m1", false);
</script>
</body>
</html>
