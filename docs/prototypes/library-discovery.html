<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomi · 资源库发现体验（原型）</title>
  <style>
    /* THROWAWAY PROTOTYPE — not production CSS.
       Question: can one left-side library entry make the four resource libraries easy to find
       without turning Nomi into a noisy “super library”? Project library remains a separate
       top-level surface in the real app. Three layouts are switchable via ?variant=. */
    :root {

      --muted: #77736a; --faint: #aaa69d; --line: #dfdcd4; --line-strong: #c8c3b8;

      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink); background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .appbar { height: 54px; display: flex; align-items: center; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .logo { font-weight: 800; letter-spacing: -.03em; }.logo i { color: var(--accent); font-style: normal; }
    .crumb { color: var(--muted); font-size: 13px; }.spacer { flex: 1; }
    .mode { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--muted); background: transparent; font-size: 12px; }
    .shell { display: grid; grid-template-columns: 58px 360px 1fr; height: calc(100vh - 54px); }
    .rail { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 15px 8px; border-right: 1px solid var(--line); background: rgba(255,254,250,.75); }
    .rail button { position: relative; width: 38px; height: 38px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 16px; }
    .rail button:hover, .rail button.active { color: var(--accent); background: var(--accent-soft); }
    .rail button.active::before { position: absolute; top: 8px; bottom: 8px; left: -8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); content: ''; }
    .rail .rail-label { display: block; margin-top: -5px; color: var(--faint); font-size: 9px; line-height: 1; }
    .rail-divider { width: 24px; height: 1px; margin: 5px 0 3px; background: var(--line); }
    .rail-bottom { display: flex; flex-direction: column; align-items: center; gap: 9px; margin-top: auto; }
    .library-panel { min-width: 0; overflow: auto; padding: 22px 16px 82px; border-right: 1px solid var(--line); background: var(--panel); }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }.panel-head h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; }.count { color: var(--muted); font-size: 11px; }
    .panel-sub { margin: 6px 0 15px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .search-wrap { position: relative; }.search { width: 100%; height: 35px; padding: 0 31px 0 10px; border: 1px solid var(--line); border-radius: 7px; outline: 0; color: var(--ink); background: #fcfbf7; font-size: 12px; }.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(101,88,215,.12); }.search-icon { position: absolute; top: 9px; right: 10px; color: var(--faint); font-size: 13px; pointer-events: none; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 10px; }.chips { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }.chip { flex: 0 0 auto; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--muted); background: transparent; font-size: 11px; }.chip:hover, .chip.active { color: var(--ink); background: #f0eee8; }.type-button, .sort-button { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; color: var(--muted); background: #fcfbf7; font-size: 11px; }.type-button:hover, .sort-button:hover { border-color: var(--line-strong); color: var(--ink); }
    .type-menu { position: absolute; z-index: 8; top: 126px; right: 16px; width: 145px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }.category-menu { right: 166px; }.type-menu button { display: block; width: 100%; border: 0; border-radius: 5px; padding: 7px 8px; color: var(--ink); background: transparent; text-align: left; font-size: 11px; }.type-menu button:hover { background: var(--accent-soft); }
    .result-note { display: flex; justify-content: space-between; margin: 15px 2px 7px; color: var(--faint); font-size: 10px; }.result-note strong { color: var(--muted); font-weight: 600; }
    .resource-card { position: relative; display: flex; align-items: center; gap: 10px; min-height: 76px; margin-top: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); transition: border .15s ease, box-shadow .15s ease, transform .15s ease; }.resource-card:hover { border-color: #b7b0f2; box-shadow: 0 4px 13px rgba(44,39,28,.06); transform: translateY(-1px); }.resource-card.selected { border-color: #b7b0f2; background: #faf9ff; box-shadow: 0 0 0 2px rgba(101,88,215,.08); }
    .asset-grid { column-count: 2; column-gap: 9px; }.asset-grid .resource-card { display: inline-block; width: 100%; min-height: 0; margin: 0 0 9px; padding: 7px; vertical-align: top; break-inside: avoid; }.asset-grid .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 7px; }.asset-grid .thumb.asset.audio { aspect-ratio: 2.2 / 1; }.asset-grid .card-copy { padding: 7px 2px 2px; }.asset-grid .card-copy strong { font-size: 11px; }.asset-grid .asset-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.filter-buttons { display: flex; align-items: center; gap: 5px; }.category-chips { flex-wrap: wrap; }
    .thumb { position: relative; display: grid; place-items: center; flex: 0 0 auto; width: 62px; height: 54px; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 7px; color: var(--accent); background: var(--accent-soft); font-size: 17px; }.thumb.project { background: linear-gradient(135deg,#ded3c7,#aebdcc); }.thumb.prompt { display: block; padding: 8px; color: #605a50; background: #f1eee7; font-family: Georgia, serif; font-size: 11px; line-height: 1.25; }.thumb.asset.image { background: linear-gradient(135deg,#c3d5dc,#d9bcae 58%,#8f778e); }.thumb.asset.video { background: linear-gradient(135deg,#303948,#8f96a5); }.thumb.asset.audio { color: #5f7b6d; background: #dcebe0; }.play { position: absolute; right: 5px; bottom: 5px; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; color: #fff; background: rgba(41,39,33,.62); font-size: 8px; }.graph-mark { position: absolute; right: 4px; bottom: 4px; display: flex; align-items: center; gap: 2px; padding: 3px 4px; border: 1px solid rgba(255,255,255,.75); border-radius: 5px; background: rgba(41,39,33,.45); }.graph-mark i { width: 7px; height: 5px; border: 1px solid #fff; border-radius: 2px; }.graph-mark b { width: 4px; height: 1px; background: rgba(255,255,255,.8); }.graph-fallback { position: relative; width: 45px; height: 32px; }.graph-fallback::before, .graph-fallback::after { position: absolute; content: ''; height: 1px; background: #aaa2eb; transform-origin: left center; }.graph-fallback::before { top: 15px; left: 9px; width: 24px; transform: rotate(-18deg); }.graph-fallback::after { top: 15px; left: 25px; width: 18px; transform: rotate(20deg); }.graph-fallback i { position: absolute; width: 11px; height: 8px; border: 1px solid var(--accent); border-radius: 2px; background: #fff; }.graph-fallback i:nth-child(1) { top: 11px; left: 0; }.graph-fallback i:nth-child(2) { top: 3px; left: 19px; }.graph-fallback i:nth-child(3) { top: 18px; right: 0; }
    .card-copy { min-width: 0; flex: 1; }.card-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 1.35; }.meta { margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }.tags { display: flex; gap: 4px; margin-top: 6px; overflow: hidden; }.tag { max-width: 100px; overflow: hidden; padding: 3px 5px; border-radius: 4px; color: var(--muted); background: #f0eee8; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }.status { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; color: var(--green); font-size: 9px; }.status.warn { color: var(--amber); }.status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .card-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }.action { border: 0; border-radius: 6px; padding: 7px 8px; color: var(--ink); background: transparent; font-size: 10px; }.action:hover { background: #f0eee8; }.action.primary { color: #fff; background: var(--accent); }.action.primary:hover { background: #5548c7; }.more { width: 27px; height: 27px; padding: 0; color: var(--muted); font-size: 16px; line-height: 1; }.favorite { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 21px; height: 21px; border: 0; border-radius: 50%; color: var(--faint); background: transparent; font-size: 13px; }.favorite.active, .favorite:hover { color: var(--amber); background: #fbf4e7; }
    .card-menu { position: absolute; z-index: 9; top: 42px; right: 9px; width: 128px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }.card-menu button { display: block; width: 100%; border: 0; border-radius: 5px; padding: 7px 8px; color: var(--ink); background: transparent; text-align: left; font-size: 10px; }.card-menu button:hover { background: var(--accent-soft); }
    .empty { margin-top: 26px; padding: 22px 10px; border: 1px dashed var(--line-strong); border-radius: 9px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.5; }.empty strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 12px; }.empty button { margin-top: 10px; border: 0; color: var(--accent); background: transparent; font-size: 11px; }
    .canvas-stage { position: relative; overflow: hidden; padding: 36px 42px; background-color: #f8f7f3; background-image: linear-gradient(#eae7df 1px, transparent 1px), linear-gradient(90deg, #eae7df 1px, transparent 1px); background-size: 28px 28px; }.stage-head { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }.stage-head strong { color: var(--ink); font-size: 14px; }.stage-head span { padding: 4px 7px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,254,250,.7); font-size: 10px; }.stage-hint { position: absolute; right: 28px; top: 28px; max-width: 200px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: rgba(255,254,250,.9); box-shadow: 0 4px 12px rgba(44,39,28,.04); font-size: 10px; line-height: 1.45; }.nodes { position: relative; width: min(760px, 86%); height: 440px; margin: 74px auto 0; }.node { position: absolute; width: 218px; min-height: 128px; padding: 13px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--paper); box-shadow: 0 5px 14px rgba(44,39,28,.06); }.node.a { left: 4%; top: 100px; }.node.b { left: 37%; top: 20px; }.node.c { right: 3%; top: 160px; }.node.selected { border: 2px solid var(--accent); box-shadow: 0 0 0 4px rgba(101,88,215,.11), var(--shadow); }.node-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }.node p { margin: 13px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }.node-foot { display: flex; gap: 6px; margin-top: 13px; color: var(--faint); font-size: 10px; }.edge { position: absolute; height: 1px; background: var(--line-strong); transform-origin: left center; }.edge.one { left: 31%; top: 174px; width: 12%; transform: rotate(-23deg); }.edge.two { left: 64%; top: 115px; width: 12%; transform: rotate(27deg); }.selection-box { position: absolute; left: 0; top: 0; width: 100%; height: 274px; border: 1px dashed var(--accent); border-radius: 12px; background: rgba(238,236,255,.18); pointer-events: none; }.selection-box span { position: absolute; top: -25px; left: 8px; color: var(--accent); font-size: 11px; }.selection-toolbar { position: absolute; top: -43px; left: 50%; display: flex; align-items: center; gap: 5px; transform: translateX(-50%); padding: 6px 8px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,254,250,.97); box-shadow: var(--shadow); white-space: nowrap; }.selection-toolbar .count { padding: 0 6px; color: var(--muted); font-size: 11px; }
    .detail-scrim { position: fixed; z-index: 20; inset: 0; background: rgba(41,39,33,.22); }.detail { position: fixed; z-index: 21; top: 50%; left: 50%; width: min(540px, calc(100vw - 48px)); max-height: calc(100vh - 112px); overflow: auto; transform: translate(-50%,-50%); padding: 22px 22px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 22px 60px rgba(44,39,28,.24); }.detail-close { float: right; width: 30px; height: 30px; border: 0; border-radius: 50%; color: var(--muted); background: transparent; font-size: 17px; }.detail-close:hover { background: #f0eee8; }.detail h2 { margin: 4px 0 6px; font-size: 17px; }.detail .detail-meta { color: var(--muted); font-size: 11px; }.detail-cover { display: grid; place-items: center; height: 180px; margin: 20px 0 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; color: var(--accent); background: var(--accent-soft); font-size: 30px; }.detail-cover.asset { height: auto; min-height: 150px; max-height: 280px; }.detail-cover.media { background: linear-gradient(135deg,#d7c7bd,#b3c4cf 48%,#6c7283); }.detail-copy { color: var(--muted); font-size: 11px; line-height: 1.55; }.detail-section { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--line); }.detail-section strong { display: block; margin-bottom: 8px; font-size: 11px; }.detail-list { margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 10px; line-height: 1.6; }.detail-list li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }.detail-list span:last-child { color: var(--ink); text-align: right; }.detail .action.primary { width: 100%; margin-top: 18px; padding: 9px; font-size: 11px; }
    .toast { position: fixed; z-index: 30; left: 50%; bottom: 72px; transform: translateX(-50%); padding: 10px 14px; border: 1px solid #c9dfd3; border-radius: 8px; color: #2f674c; background: #eff8f2; box-shadow: var(--shadow); font-size: 11px; }
    .scrim { position: fixed; z-index: 18; inset: 0; background: rgba(41,39,33,.18); }.edit-panel { position: fixed; z-index: 19; top: 50%; left: 50%; width: 350px; transform: translate(-50%,-50%); padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 18px 48px rgba(44,39,28,.2); }.edit-panel h3 { margin: 0; font-size: 14px; }.edit-panel p { margin: 5px 0 16px; color: var(--muted); font-size: 10px; line-height: 1.4; }.edit-panel label { display: block; margin-top: 10px; color: var(--muted); font-size: 10px; }.edit-panel input, .edit-panel textarea { display: block; width: 100%; margin-top: 5px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; outline: 0; color: var(--ink); background: #fcfbf7; font-size: 11px; }.edit-panel textarea { min-height: 62px; resize: vertical; line-height: 1.45; }.edit-panel input:focus, .edit-panel textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(101,88,215,.12); }.edit-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 16px; }

    /* Variant B: a calm, full-width discovery page. Variant C: a small command palette over the canvas. */

    .variant-b .asset-grid { column-count: 4; }.variant-b .asset-grid .resource-card { min-height: 0; padding: 7px; }.variant-b .asset-grid .thumb { width: 100%; height: auto; }.variant-b .asset-grid .card-copy strong { font-size: 11px; }.variant-b .asset-grid .meta { font-size: 10px; }
    .variant-c { position: relative; display: grid; grid-template-columns: 58px 1fr; height: calc(100vh - 54px); overflow: hidden; }.variant-c .canvas-stage { grid-column: 2; }.palette-scrim { position: absolute; z-index: 4; inset: 0; background: rgba(41,39,33,.16); }.palette { position: absolute; z-index: 5; top: 86px; left: 50%; width: 540px; transform: translateX(-50%); padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 18px 48px rgba(44,39,28,.2); }.palette-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 5px 10px; }.palette-head strong { font-size: 13px; }.palette-head span { color: var(--muted); font-size: 10px; }.palette .search { height: 38px; }.palette-group { margin-top: 12px; color: var(--faint); font-size: 10px; }.palette-item { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 10px; border-radius: 8px; }.palette-item:hover, .palette-item.active { background: var(--accent-soft); }.palette-item .p-icon { display: grid; place-items: center; width: 34px; height: 30px; border-radius: 6px; color: var(--accent); background: #f0eee8; font-size: 15px; }.palette-item .p-copy { min-width: 0; flex: 1; }.palette-item strong { display: block; font-size: 11px; }.palette-item small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }.palette-item .key { color: var(--faint); font-size: 11px; }.palette-foot { margin-top: 9px; padding: 8px 5px 2px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }

<body>
  <header class="appbar"><div class="logo">N<span><i>o</i>mi</span></div><div class="crumb">我的项目 / 生成画布 / 资源库</div><div class="spacer"></div><button class="mode">原型 · 只读</button></header>
  <div id="app"></div>
  <div class="switcher" aria-label="原型变体切换"><button id="prev" aria-label="上一种方案">‹</button><div class="label" id="variant-label"></div><button id="next" aria-label="下一种方案">›</button></div>
  <script>
    const variants = [
      { key: 'A', name: '左侧栏库（推荐）' },
      { key: 'B', name: '独立资源页' },
      { key: 'C', name: '画布快速插入' },
    ];
    // This rail mirrors ProjectExplorerSidebar's real resource tabs. There is no
    // product-level “概览” tab: the old entry was only scaffolding for comparing
    // library layouts and made the prototype imply a second “super library”.
    const railItems = [
      { id: 'workflow', label: '流程', icon: '↗' },
      { id: 'prompt', label: '提示词', icon: '✦' },
      { id: 'skill', label: 'Skill', icon: '◇' },
      { id: 'asset', label: '素材', icon: '▦' },
    ];
    const libraryMeta = {
      project: { title: '项目库', sub: '找到一个项目，继续上次的创作。', noun: '项目' },
      workflow: { title: '流程库', sub: '把一套已经调好的节点和素材，原样复制到当前画布。', noun: '流程' },
      prompt: { title: '提示词库', sub: '把验证过的描述送回当前节点，不用重新翻聊天记录。', noun: '提示词' },
      skill: { title: 'Skill 库', sub: '调用可用的创作能力，缺少依赖时提前说清楚。', noun: 'Skill' },
      asset: { title: '素材库', sub: '跨项目找到素材，再明确导入到当前项目。', noun: '素材' },
    };

    function openEdit(id) { const item = Object.values(data).flat().find((candidate) => candidate.id === id); openMenuId = null; const scrim = document.createElement('div'); scrim.className = 'scrim'; const panel = document.createElement('form'); panel.className = 'edit-panel'; panel.innerHTML = `<h3>编辑${libraryMeta[activeLibrary].noun}信息</h3><p>只改资料，不改资源本体。工作流的节点、素材和参数仍保持原样。</p><label>名称<input name="name" value="${escapeHtml(item.title)}" /></label><label>描述<textarea name="description">${escapeHtml(item.description)}</textarea></label><label>标签<input name="tags" value="${escapeHtml((item.tags || []).join('、'))}" /></label><div class="edit-actions"><button type="button" class="action" data-cancel>取消</button><button type="submit" class="action primary">保存</button></div>`; document.body.append(scrim, panel); const close = () => { scrim.remove(); panel.remove(); }; scrim.addEventListener('click', close); panel.querySelector('[data-cancel]').addEventListener('click', close); panel.addEventListener('submit', (event) => { event.preventDefault(); const form = new FormData(panel); item.title = form.get('name'); item.description = form.get('description'); item.tags = String(form.get('tags')).split(/[、,，]/).map((tag) => tag.trim()).filter(Boolean); close(); notify('资料已更新，资源本体没有改变'); render(); }); panel.querySelector('input').focus(); }
    function setVariant(next) { current = (next + variants.length) % variants.length; const url = new URL(location.href); url.searchParams.set('variant', current); url.searchParams.set('library', activeLibrary); history.replaceState({}, '', url); selectedId = null; openMenuId = null; render(); }
    document.getElementById('prev').onclick = () => setVariant(current - 1); document.getElementById('next').onclick = () => setVariant(current + 1); document.addEventListener('keydown', (event) => { if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return; if (event.key === 'Escape' && selectedId) { selectedId = null; openMenuId = null; render(); } if (event.key === 'ArrowLeft') setVariant(current - 1); if (event.key === 'ArrowRight') setVariant(current + 1); }); render();
  </script>
</body>
