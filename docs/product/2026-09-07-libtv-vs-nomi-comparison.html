const J = {
  lead:{t:"领先",cls:"b-lead",color:"var(--green)"},
  par:{t:"持平",cls:"b-par",color:"var(--blue)"},
  part:{t:"部分",cls:"b-part",color:"var(--amber)"},
  miss:{t:"缺失",cls:"b-miss",color:"var(--red)"},
  na:{t:"不跟",cls:"b-na",color:"var(--gray)"},
};

let state = { judge:null, chapter:"", q:"", collapsed:new Set() };

function render(){
  const tbody = document.getElementById("tbody");
  const rows = [];
  let cur = null, shown = 0;
  const matches = (d) => {
    if (d.s) return null;
    if (state.judge && d.j !== state.judge) return false;
    if (state.chapter && d.c !== state.chapter) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      const hay = [d.f,d.lt,d.nm,d.fx,d.ev||"",d.id].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  };
  for (const d of DATA){
    if (d.s){
      cur = { s:d.s, items:[], all:[] };
      rows.push(cur);
      continue;
    }
    cur.all.push(d);
    const m = matches(d);
    if (m) cur.items.push(d);
  }
  tbody.innerHTML = "";
  for (const grp of rows){
    const items = grp.items;
    const isCollapsed = state.collapsed.has(grp.s);
    const tr = document.createElement("tr");
    tr.className = "section-row";
    tr.innerHTML = `<td colspan="6">${grp.s}<span class="cnt">${state.judge||state.chapter||state.q ? items.length+" / "+grp.all.length+" 项" : grp.all.length+" 项"}</span></td>`;
    tr.onclick = () => { isCollapsed ? state.collapsed.delete(grp.s) : state.collapsed.add(grp.s); render(); };
    tbody.appendChild(tr);
    if (isCollapsed) continue;
    if (!items.length){
      const tr2 = document.createElement("tr");
      tr2.innerHTML = `<td colspan="6" style="color:var(--text-3)">本节无匹配项</td>`;
      tbody.appendChild(tr2);
      continue;
    }
    for (const d of items){
      shown++;
      const j = J[d.j];
      const evi = d.ev ? d.ev.split(" · ").map(e=>`<code>${e}</code>`).join(" ") : "—";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="id">${d.id}</td>
        <td class="feat">${d.f}</td>
        <td class="detail hide-sm">${d.lt}</td>
        <td class="detail">${d.nm}<div class="evi">${evi}</div></td>
        <td><span class="badge ${j.cls}">${j.t}</span></td>
        <td class="fix">${d.fx}</td>`;
      tbody.appendChild(tr);
    }
  }
  if (!shown){
    tbody.innerHTML = `<tr><td colspan="6" class="empty">没有匹配的功能点，试试清除筛选</td></tr>`;
  }
}

// stats
const counts = {};
DATA.filter(d=>!d.s).forEach(d=>{ counts[d.j]=(counts[d.j]||0)+1; });
const statsEl = document.getElementById("stats");
Object.entries(J).forEach(([k,v])=>{
  const el = document.createElement("div");
  el.className = "stat"; el.dataset.j = k;
  el.innerHTML = `<div class="num" style="color:${v.color}">${counts[k]||0}</div><div class="lbl"><span class="dot" style="background:${v.color}"></span>${v.t}</div>`;
  el.onclick = () => {
    state.judge = state.judge === k ? null : k;
    document.querySelectorAll(".stat").forEach(s=>s.classList.toggle("active", s.dataset.j===state.judge));
    render();
  };
  statsEl.appendChild(el);
});
document.getElementById("totalCount").textContent = DATA.filter(d=>!d.s).length;

// chapters
const chapters = [...new Set(DATA.filter(d=>!d.s).map(d=>d.c))];
const chSel = document.getElementById("chapterFilter");
chapters.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c; chSel.appendChild(o); });
chSel.onchange = () => { state.chapter = chSel.value; render(); };

// search
document.getElementById("search").oninput = (e)=>{ state.q = e.target.value.trim(); render(); };

render();
</script>
