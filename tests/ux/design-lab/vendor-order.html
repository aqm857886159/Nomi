<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>Vendor preference picker · design lab</title>
<style>
  :root { color-scheme: light; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f3; color:#232323; }
  body { margin:0; padding:32px; }
  h1 { margin:0 0 6px; font-size:20px; } p { margin:0 0 24px; color:#777; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(280px,1fr)); gap:18px; max-width:900px; }
  .card { background:#fff; border:1px solid #deded8; border-radius:12px; padding:16px; box-shadow:0 4px 14px #0000000d; }
  .eyebrow { color:#8a8a83; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  .picker { margin-top:12px; border:1px solid #d7d7d0; border-radius:10px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #ededeb; }
  .row:last-child { border-bottom:0; } .name { flex:1; } .chip { border:1px solid #c9c9c2; border-radius:999px; padding:2px 7px; font-size:11px; color:#70706a; }
  .chip.preferred { border-color:#6c62e8; color:#5146ce; background:#efeeff; } .chip.unconfigured { opacity:.45; }
  .group { padding:7px 12px 4px; color:#999; font-size:11px; background:#fafaf8; }
  .empty { padding:22px 12px; color:#999; text-align:center; }
  .settings { max-width:520px; margin-top:28px; } .setting-row { display:flex; align-items:center; gap:12px; padding:11px 12px; border-top:1px solid #ededeb; }
  .rank { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:#efeeff; color:#5146ce; font-size:12px; } .setting-row span:nth-child(2){flex:1}
  button { border:1px solid #d7d7d0; border-radius:7px; background:#fff; padding:4px 8px; color:#555; }
</style>
<body>
  <h1>供应商偏好 · 第一阶段实验室</h1>
  <p>同一模型折成一行；偏好供应商高亮排第一；未配置供应商沉到底部并保持可接入。</p>
  <div class="grid">
    <section class="card"><div class="eyebrow">01 · 有偏好</div><div class="picker"><div class="row"><span class="name">Seedream 4.5</span><span class="chip preferred">APIMart</span><span class="chip">Kie</span></div></div></section>
    <section class="card"><div class="eyebrow">02 · 无偏好</div><div class="picker"><div class="row"><span class="name">Seedream 4.5</span><span class="chip preferred">APIMart</span><span class="chip">Kie</span></div></div></section>
    <section class="card"><div class="eyebrow">03 · 有未配置分组</div><div class="picker"><div class="row"><span class="name">Seedream 4.5</span><span class="chip preferred">APIMart</span><span class="chip unconfigured">Future Relay</span></div><div class="group">未配置的供应商</div><div class="row"><span class="name">Kling 3</span><span class="chip unconfigured">Future Relay</span></div></div></section>
    <section class="card"><div class="eyebrow">04 · 全部未配置空态</div><div class="picker"><div class="group">未配置的供应商</div><div class="empty">暂无已配置供应商，点击模型行可去接入</div></div></section>
  </div>
  <section class="card settings"><div class="eyebrow">设置 → 模型 · 优先供应商</div><p style="margin:6px 0 4px">只列已配置的家，上下移后立即持久化。</p><div class="setting-row"><span class="rank">1</span><span>APIMart</span><button>↑</button><button>↓</button></div><div class="setting-row"><span class="rank">2</span><span>Kie</span><button>↑</button><button>↓</button></div><div class="setting-row"><span class="rank">3</span><span>Volcengine</span><button>↑</button><button>↓</button></div></section>
</body>
</html>
